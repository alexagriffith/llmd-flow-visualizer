<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>llm-d Request Flow Visualizer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            overflow: hidden;
        }
        #container {
            display: flex;
            height: 100vh;
        }
        #canvas-wrapper {
            flex: 1;
            position: relative;
            overflow: auto;
        }
        canvas {
            display: block;
            background: #0a0a0a;
        }
        #controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.95);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #333;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        #controls h1 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #a78bfa;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #controls h1 svg {
            width: 24px;
            height: 24px;
        }
        .flow-selector {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }
        .flow-btn {
            padding: 10px 16px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            color: #e0e0e0;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
            font-size: 13px;
        }
        .flow-btn:hover {
            background: #2a2a2a;
            border-color: #555;
        }
        .flow-btn.active {
            background: #7c3aed;
            border-color: #7c3aed;
            color: white;
        }
        .flow-btn strong {
            display: block;
            margin-bottom: 4px;
        }
        .playback-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .control-btn {
            padding: 8px 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #e0e0e0;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        .control-btn:hover {
            background: #2a2a2a;
        }
        .control-btn.primary {
            background: #7c3aed;
            border-color: #7c3aed;
            color: white;
        }
        .control-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        #speed-control {
            padding: 6px;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 6px;
            color: #e0e0e0;
            font-size: 12px;
        }
        #step-info {
            font-size: 12px;
            color: #888;
            margin-top: 10px;
        }
        #right-panel {
            width: 350px;
            background: rgba(20, 20, 20, 0.95);
            border-left: 1px solid #333;
            overflow-y: auto;
            padding: 20px;
        }
        #right-panel h2 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #a78bfa;
        }
        .step-item {
            padding: 12px;
            margin-bottom: 8px;
            background: #1a1a1a;
            border-radius: 8px;
            border-left: 3px solid #333;
            cursor: pointer;
            transition: all 0.2s;
        }
        .step-item:hover {
            background: #2a2a2a;
        }
        .step-item.active {
            border-left-color: #7c3aed;
            background: #2a2a2a;
        }
        .step-item.completed {
            opacity: 0.6;
        }
        .step-number {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: #333;
            border-radius: 50%;
            text-align: center;
            line-height: 24px;
            font-size: 12px;
            font-weight: bold;
            margin-right: 8px;
        }
        .step-item.active .step-number {
            background: #7c3aed;
            color: white;
        }
        .step-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .step-detail {
            font-size: 11px;
            color: #888;
        }
        #theme-toggle {
            position: fixed;
            top: 20px;
            right: 370px;
            padding: 8px 12px;
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid #333;
            border-radius: 8px;
            cursor: pointer;
            z-index: 100;
            color: #e0e0e0;
            font-size: 12px;
        }
        body.light {
            background: #f5f5f5;
            color: #1a1a1a;
        }
        body.light canvas {
            background: #f5f5f5;
        }
        body.light #controls,
        body.light #theme-toggle {
            background: rgba(255, 255, 255, 0.95);
            border-color: #ddd;
            color: #1a1a1a;
        }
        body.light #right-panel {
            background: rgba(255, 255, 255, 0.95);
            border-left-color: #ddd;
        }
        body.light .flow-btn,
        body.light .control-btn,
        body.light #speed-control,
        body.light .step-item {
            background: #fafafa;
            border-color: #ddd;
            color: #1a1a1a;
        }
        body.light .flow-btn:hover,
        body.light .control-btn:hover,
        body.light .step-item:hover {
            background: #f0f0f0;
        }
        body.light .flow-btn.active {
            background: #7c3aed;
            color: white;
        }
        body.light .control-btn.primary {
            background: #7c3aed;
            color: white;
        }
        body.light .step-number {
            background: #e0e0e0;
        }
        body.light .step-item.active .step-number {
            background: #7c3aed;
            color: white;
        }
    </style>
</head>
<body>
    <button id="theme-toggle">Toggle Theme</button>

    <div id="container">
        <div id="canvas-wrapper">
            <canvas id="canvas"></canvas>
        </div>

        <div id="right-panel">
            <h2>Flow Steps</h2>
            <div id="steps-list"></div>
        </div>
    </div>

    <div id="controls">
        <h1>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
            llm-d Flow Visualizer
        </h1>

        <div class="flow-selector">
            <button class="flow-btn active" data-flow="cache-hit">
                <strong>Cache Hit Flow</strong>
                <span>High prefix overlap → fast path</span>
            </button>
            <button class="flow-btn" data-flow="cache-miss">
                <strong>Cache Miss Flow</strong>
                <span>New prompt → full prefill</span>
            </button>
            <button class="flow-btn" data-flow="disaggregated">
                <strong>Disaggregated Serving</strong>
                <span>P/D split with NIXL transfer</span>
            </button>
        </div>

        <div class="playback-controls">
            <button class="control-btn primary" id="play-btn">Play</button>
            <button class="control-btn" id="reset-btn">Reset</button>
            <button class="control-btn" id="prev-btn">◄</button>
            <button class="control-btn" id="next-btn">►</button>
        </div>

        <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 10px;">
            <label style="font-size: 12px;">Speed:</label>
            <select id="speed-control">
                <option value="2000">0.5x</option>
                <option value="1000" selected>1x</option>
                <option value="500">2x</option>
            </select>
        </div>

        <div id="step-info">Step 0 of 0</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const stepsList = document.getElementById('steps-list');

        // Set canvas size
        canvas.width = 1200;
        canvas.height = 900;

        let currentFlow = 'cache-hit';
        let currentStep = 0;
        let isPlaying = false;
        let playbackSpeed = 1000;
        let playTimer = null;
        let isDark = true;

        // Node definitions
        const N = {
            client: { x: 100, y: 50, w: 120, h: 60, label: 'User/Client', type: 'external' },
            gateway: { x: 100, y: 180, w: 180, h: 80, label: 'Gateway API\n(Istio/Envoy)', type: 'gateway' },
            extproc: { x: 100, y: 320, w: 180, h: 70, label: 'Envoy ext-proc', type: 'plugin' },
            epp: { x: 400, y: 320, w: 160, h: 70, label: 'EPP\n(Endpoint Picker)', type: 'core' },
            kvindex: { x: 700, y: 250, w: 180, h: 80, label: 'KV Cache Index', type: 'storage' },
            vlmPodA: { x: 400, y: 520, w: 160, h: 80, label: 'vLLM Pod A\n(High cache hit)', type: 'inference' },
            vllmPodB: { x: 650, y: 520, w: 160, h: 80, label: 'vLLM Pod B\n(Least loaded)', type: 'inference' },
            kvstore: { x: 900, y: 520, w: 160, h: 80, label: 'KV Cache Store', type: 'storage' },
            prefillPool: { x: 400, y: 520, w: 180, h: 80, label: 'Prefill Pool\n(vLLM)', type: 'inference' },
            nixl: { x: 650, y: 580, w: 140, h: 60, label: 'NIXL Transfer\n(GPU-to-GPU)', type: 'network' },
            decodePool: { x: 900, y: 520, w: 180, h: 80, label: 'Decode Pool\n(vLLM)', type: 'inference' },
            response: { x: 100, y: 720, w: 120, h: 60, label: 'Response', type: 'external' },
        };

        // Flow definitions
        const flows = {
            'cache-hit': {
                name: 'Cache Hit Flow (Fast Path)',
                description: 'Request with high prefix cache overlap - routed to pod with cached KV',
                steps: [
                    { nodes: ['client'], desc: 'User sends inference request', detail: 'POST /v1/completions with prompt' },
                    { nodes: ['client', 'gateway'], desc: 'Gateway receives request', detail: 'HTTP/2 ingress with TLS termination', arrow: true },
                    { nodes: ['gateway', 'extproc'], desc: 'Envoy calls ext-proc hook', detail: 'gRPC call for routing decision', arrow: true },
                    { nodes: ['extproc', 'epp'], desc: 'EPP queries for routing', detail: 'External processing plugin invokes EPP', arrow: true },
                    { nodes: ['epp', 'kvindex'], desc: 'Check KV cache overlap', detail: 'Calculates prefix-cache-score per pod', arrow: true },
                    { nodes: ['kvindex'], desc: 'Returns cache hit rates', detail: 'Pod A: 85% hit, Pod B: 12% hit' },
                    { nodes: ['epp', 'vlmPodA'], desc: 'Routes to Pod A (highest hit)', detail: 'Intelligent cache-aware routing', arrow: true },
                    { nodes: ['vlmPodA'], desc: 'Serves with cached KV', detail: '85% of prefill skipped - fast TTFT' },
                    { nodes: ['vlmPodA', 'response'], desc: 'Streaming response', detail: 'Low latency due to cache hit', arrow: true },
                ]
            },
            'cache-miss': {
                name: 'Cache Miss Flow (Cold Start)',
                description: 'New prompt with no cache overlap - full prefill required',
                steps: [
                    { nodes: ['client'], desc: 'User sends new prompt', detail: 'POST /v1/completions with novel content' },
                    { nodes: ['client', 'gateway'], desc: 'Gateway receives request', detail: 'HTTP/2 ingress with TLS termination', arrow: true },
                    { nodes: ['gateway', 'extproc'], desc: 'Envoy calls ext-proc hook', detail: 'gRPC call for routing decision', arrow: true },
                    { nodes: ['extproc', 'epp'], desc: 'EPP queries for routing', detail: 'External processing plugin invokes EPP', arrow: true },
                    { nodes: ['epp', 'kvindex'], desc: 'Check KV cache overlap', detail: 'Calculates prefix-cache-score per pod', arrow: true },
                    { nodes: ['kvindex'], desc: 'Returns low hit rates', detail: 'Pod A: 5%, Pod B: 3%, Pod C: 2%' },
                    { nodes: ['epp', 'vllmPodB'], desc: 'Routes to least-loaded pod', detail: 'Fallback to queue depth strategy', arrow: true },
                    { nodes: ['vllmPodB'], desc: 'Full prefill required', detail: 'No cached KV - compute entire context' },
                    { nodes: ['vllmPodB', 'kvstore'], desc: 'Caches new prefix', detail: 'Stores KV for future requests', arrow: true },
                    { nodes: ['vllmPodB', 'response'], desc: 'Streaming response', detail: 'Higher TTFT due to full prefill', arrow: true },
                ]
            },
            'disaggregated': {
                name: 'Disaggregated Serving (P/D Split)',
                description: 'Static pool configuration with separate prefill and decode phases',
                steps: [
                    { nodes: ['client'], desc: 'User sends request', detail: 'Long prompt requiring disaggregation' },
                    { nodes: ['client', 'gateway'], desc: 'Gateway routes to prefill', detail: 'EPP determines prefill vs decode', arrow: true },
                    { nodes: ['gateway', 'prefillPool'], desc: 'Prefill pool receives request', detail: 'Smaller TP, compute-optimized', arrow: true },
                    { nodes: ['prefillPool'], desc: 'Computes KV cache', detail: 'Prefill phase generates KV tensors' },
                    { nodes: ['prefillPool', 'nixl'], desc: 'Initiates KV transfer', detail: 'GPU-to-GPU RDMA via NIXL', arrow: true },
                    { nodes: ['nixl', 'decodePool'], desc: 'KV transferred to decode', detail: 'InfiniBand/RoCE wire-speed transfer', arrow: true },
                    { nodes: ['decodePool'], desc: 'Autoregressive decode', detail: 'Larger TP, memory-optimized' },
                    { nodes: ['decodePool', 'response'], desc: 'Streaming tokens', detail: 'Optimized throughput from P/D split', arrow: true },
                ]
            }
        };

        // Colors
        const colors = {
            dark: {
                bg: '#0a0a0a',
                text: '#e0e0e0',
                external: '#3b82f6',
                gateway: '#8b5cf6',
                plugin: '#ec4899',
                core: '#10b981',
                storage: '#f59e0b',
                inference: '#06b6d4',
                network: '#6366f1',
                arrow: '#7c3aed',
                inactive: '#333',
            },
            light: {
                bg: '#f5f5f5',
                text: '#1a1a1a',
                external: '#2563eb',
                gateway: '#7c3aed',
                plugin: '#db2777',
                core: '#059669',
                storage: '#d97706',
                inference: '#0891b2',
                network: '#4f46e5',
                arrow: '#7c3aed',
                inactive: '#d0d0d0',
            }
        };

        function getColor(key) {
            return isDark ? colors.dark[key] : colors.light[key];
        }

        function drawNode(node, active = false) {
            const alpha = active ? 1.0 : 0.3;
            ctx.save();
            ctx.globalAlpha = alpha;

            // Draw rectangle
            ctx.fillStyle = getColor(node.type);
            ctx.strokeStyle = active ? getColor('arrow') : getColor('inactive');
            ctx.lineWidth = active ? 3 : 1;

            roundRect(ctx, node.x, node.y, node.w, node.h, 8);
            ctx.fill();
            ctx.stroke();

            // Draw label
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 14px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            const lines = node.label.split('\n');
            const lineHeight = 18;
            const startY = node.y + node.h / 2 - (lines.length - 1) * lineHeight / 2;

            lines.forEach((line, i) => {
                ctx.fillText(line, node.x + node.w / 2, startY + i * lineHeight);
            });

            ctx.restore();
        }

        function drawArrow(from, to) {
            ctx.save();
            ctx.strokeStyle = getColor('arrow');
            ctx.fillStyle = getColor('arrow');
            ctx.lineWidth = 3;

            const fromX = from.x + from.w / 2;
            const fromY = from.y + from.h;
            const toX = to.x + to.w / 2;
            const toY = to.y;

            // Draw line
            ctx.beginPath();
            ctx.moveTo(fromX, fromY);
            ctx.lineTo(toX, toY);
            ctx.stroke();

            // Draw arrowhead
            const angle = Math.atan2(toY - fromY, toX - fromX);
            const arrowSize = 10;
            ctx.beginPath();
            ctx.moveTo(toX, toY);
            ctx.lineTo(
                toX - arrowSize * Math.cos(angle - Math.PI / 6),
                toY - arrowSize * Math.sin(angle - Math.PI / 6)
            );
            ctx.lineTo(
                toX - arrowSize * Math.cos(angle + Math.PI / 6),
                toY - arrowSize * Math.sin(angle + Math.PI / 6)
            );
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        function roundRect(ctx, x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function render() {
            // Clear canvas
            ctx.fillStyle = getColor('bg');
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const flow = flows[currentFlow];
            const activeNodes = new Set();
            const arrows = [];

            // Collect active nodes and arrows up to current step
            for (let i = 0; i <= currentStep; i++) {
                const step = flow.steps[i];
                step.nodes.forEach(n => activeNodes.add(n));

                if (step.arrow && step.nodes.length === 2) {
                    arrows.push({ from: step.nodes[0], to: step.nodes[1] });
                }
            }

            // Draw all nodes
            Object.entries(N).forEach(([key, node]) => {
                drawNode(node, activeNodes.has(key));
            });

            // Draw arrows
            arrows.forEach(({ from, to }) => {
                drawArrow(N[from], N[to]);
            });
        }

        function updateStepsList() {
            const flow = flows[currentFlow];
            stepsList.innerHTML = '';

            flow.steps.forEach((step, idx) => {
                const div = document.createElement('div');
                div.className = 'step-item';
                if (idx === currentStep) div.classList.add('active');
                if (idx < currentStep) div.classList.add('completed');

                div.innerHTML = `
                    <span class="step-number">${idx + 1}</span>
                    <div style="display: inline-block; vertical-align: top; width: calc(100% - 36px);">
                        <div class="step-title">${step.desc}</div>
                        <div class="step-detail">${step.detail}</div>
                    </div>
                `;

                div.onclick = () => {
                    currentStep = idx;
                    updateStepsList();
                    render();
                    updateStepInfo();
                };

                stepsList.appendChild(div);
            });
        }

        function updateStepInfo() {
            const flow = flows[currentFlow];
            document.getElementById('step-info').textContent =
                `Step ${currentStep + 1} of ${flow.steps.length}`;
        }

        function play() {
            const flow = flows[currentFlow];
            if (currentStep >= flow.steps.length - 1) {
                currentStep = 0;
            }
            isPlaying = true;
            document.getElementById('play-btn').textContent = 'Pause';

            playTimer = setInterval(() => {
                currentStep++;
                if (currentStep >= flow.steps.length) {
                    pause();
                    currentStep = flow.steps.length - 1;
                }
                render();
                updateStepsList();
                updateStepInfo();
            }, playbackSpeed);
        }

        function pause() {
            isPlaying = false;
            clearInterval(playTimer);
            document.getElementById('play-btn').textContent = 'Play';
        }

        function reset() {
            pause();
            currentStep = 0;
            render();
            updateStepsList();
            updateStepInfo();
        }

        // Event listeners
        document.querySelectorAll('.flow-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.flow-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFlow = btn.dataset.flow;
                reset();
            });
        });

        document.getElementById('play-btn').addEventListener('click', () => {
            if (isPlaying) pause();
            else play();
        });

        document.getElementById('reset-btn').addEventListener('click', reset);

        document.getElementById('prev-btn').addEventListener('click', () => {
            if (currentStep > 0) {
                currentStep--;
                render();
                updateStepsList();
                updateStepInfo();
            }
        });

        document.getElementById('next-btn').addEventListener('click', () => {
            const flow = flows[currentFlow];
            if (currentStep < flow.steps.length - 1) {
                currentStep++;
                render();
                updateStepsList();
                updateStepInfo();
            }
        });

        document.getElementById('speed-control').addEventListener('change', (e) => {
            playbackSpeed = parseInt(e.target.value);
            if (isPlaying) {
                pause();
                play();
            }
        });

        document.getElementById('theme-toggle').addEventListener('click', () => {
            isDark = !isDark;
            document.body.classList.toggle('light');
            render();
        });

        // Initial render
        render();
        updateStepsList();
        updateStepInfo();
    </script>
</body>
</html>
