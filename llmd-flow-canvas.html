<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<parameter name="viewport" content="width=device-width, initial-scale=1.0">
<title>llm-d Request Flow Visualizer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9;overflow:hidden;transition:background .3s,color .3s}
body.light{background:#fff;color:#24292f}

.right-panel{position:fixed;top:0;right:0;width:380px;height:100vh;z-index:100;display:flex;flex-direction:column;background:#161b22;border-left:1px solid #30363d;overflow:hidden;transition:background .3s,border-color .3s}
body.light .right-panel{background:#f6f8fa;border-color:#d0d7de}

.flow-bar{padding:12px 16px;border-bottom:1px solid #30363d;flex-shrink:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
body.light .flow-bar{border-color:#d0d7de}
.flow-bar select{flex:1;padding:7px 10px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;font-size:13px;font-family:inherit;cursor:pointer}
body.light .flow-bar select{background:#fff;color:#24292f;border-color:#d0d7de}
.flow-bar button{padding:7px 14px;border:1px solid #30363d;border-radius:6px;background:#161b22;color:#c9d1d9;cursor:pointer;font-size:13px;font-family:inherit;transition:all .15s}
body.light .flow-bar button{background:#f6f8fa;color:#24292f;border-color:#d0d7de}
.flow-bar button:hover{border-color:#58a6ff}
.flow-bar .start{border-color:#3fb950;color:#3fb950;min-width:90px}
.flow-bar .rst{border-color:#f0883e;color:#f0883e}

.steps-section{padding:10px 16px;border-bottom:1px solid #30363d;flex:2;overflow-y:auto}
body.light .steps-section{border-color:#d0d7de}
.steps-title{font-weight:700;margin-bottom:6px;font-size:14px}
.step{margin:2px 0;color:#484f58;display:flex;align-items:flex-start;gap:6px;font-size:12px;line-height:1.4;cursor:pointer;padding:3px 4px;border-radius:4px;transition:all .2s}
body.light .step{color:#b0b8c1}
.step:hover{background:#58a6ff22;cursor:pointer;color:#58a6ff;transform:translateX(4px);border-left:2px solid #58a6ff;padding-left:6px}
body.light .step:hover{background:#ddf4ff88;cursor:pointer;color:#0969da;transform:translateX(4px);border-left:2px solid #0969da;padding-left:6px}
.step-mk{flex-shrink:0;width:16px;text-align:center;font-size:13px}
.step.pending{color:#484f58}
body.light .step.pending{color:#b0b8c1}
.step.pending .step-mk::before{content:'\25CB'}
.step.active{color:#58a6ff}
.step.active .step-mk::before{content:'\25CF'}
.step.done{color:#3fb950}
.step.done .step-mk::before{content:'\2713'}

.insp-section{flex:3;overflow-y:auto;padding:10px 16px;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:11px}
.insp-title{font-weight:700;font-size:14px;margin-bottom:6px;font-family:-apple-system,sans-serif}
.insp-sec{margin:6px 0 2px;font-weight:600;color:#58a6ff;font-size:12px;font-family:-apple-system,sans-serif}
.insp-line{margin:1px 0;padding:2px 6px;border-radius:3px;white-space:pre;line-height:1.6}

.theme-toggle{position:fixed;top:16px;right:396px;z-index:200;width:36px;height:36px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#c9d1d9;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s}
body.light .theme-toggle{background:#f6f8fa;color:#24292f;border-color:#d0d7de}

.viz-title{position:fixed;top:14px;left:0;right:380px;z-index:200;text-align:center;font-size:22px;font-weight:700;background:linear-gradient(135deg,#58a6ff,#d2a8ff,#f0883e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.5px;pointer-events:none}

.legend{position:fixed;bottom:16px;left:16px;z-index:100;padding:10px 14px;background:#161b22;border:1px solid #30363d;border-radius:10px;font-size:13px;transition:all .3s}
body.light .legend{background:#f6f8fa;border-color:#d0d7de}
.legend-title{font-weight:600;margin-bottom:5px;font-size:14px}
.legend-item{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}
.legend-dot{width:11px;height:11px;border-radius:50%}

.steps-section::-webkit-scrollbar,.insp-section::-webkit-scrollbar{width:6px}
.steps-section::-webkit-scrollbar-track,.insp-section::-webkit-scrollbar-track{background:transparent}
.steps-section::-webkit-scrollbar-thumb,.insp-section::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
body.light .steps-section::-webkit-scrollbar-thumb,body.light .insp-section::-webkit-scrollbar-thumb{background:#d0d7de}
</style>
</head>
<body>
<div class="theme-toggle" id="thm" onclick="toggleTheme()">☾</div>
<div class="viz-title">llm-d Request Flow Visualizer</div>

<canvas id="canvas"></canvas>

<div class="right-panel">
  <div class="flow-bar">
    <select id="flowSel" onchange="changeFlow()">
      <option value="cache-hit">Cache Hit Flow (Fast Path)</option>
      <option value="cache-miss">Cache Miss Flow (Cold Start)</option>
      <option value="disaggregated">Disaggregated Serving (P/D Split)</option>
    </select>
    <button class="start" id="playBtn" onclick="togglePlay()">▶ Start</button>
    <button onclick="reset()">Reset</button>
    <select style="width:60px;padding:6px 8px;background:#0d1117;border:1px solid #30363d;border-radius:6px;color:#c9d1d9;font-size:12px" onchange="changeSpeed(event)">
      <option value="2">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="0.5">2x</option>
    </select>
  </div>

  <div class="steps-section">
    <div class="steps-title">Flow Steps <span style="color:#8b949e;font-weight:400;font-size:11px">· click to jump</span></div>
    <div id="stepsList"></div>
  </div>

  <div class="insp-section">
    <div class="insp-title">Request / Response</div>
    <div id="inspector"></div>
  </div>
</div>

<div class="legend">
  <div class="legend-title">Legend</div>
  <div class="legend-item"><div class="legend-dot" style="background:#58a6ff"></div>Request</div>
  <div class="legend-item"><div class="legend-dot" style="background:#3fb950"></div>Response</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f0883e"></div>Storage</div>
  <div class="legend-item"><div class="legend-dot" style="background:#d2a8ff"></div>Inference Pods</div>
  <div class="legend-item"><div class="legend-dot" style="background:#8b949e"></div>GPU Transfer</div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, sc = 1, ox = 0, oy = 30;
const LW = 1600, LH = 1100;

let isDark = true;
let currentFlow = 'cache-hit';
let stepIdx = 0;
let running = false;
let playbackSpeed = 1;
let stepTimer = null;

// Transform helpers
const tx = x => x * sc + ox;
const ty = y => y * sc + oy;
const ts = s => s * sc;

// Node definitions
const N = {
  user: { x: 50, y: 200, w: 140, h: 60, label: 'Client', color: '#58a6ff' },
  cluster: { x: 250, y: 80, w: 1280, h: 980, type: 'boundary', label: 'kubernetes cluster' },
  gateway: { x: 300, y: 120, w: 1180, h: 90, label: 'Gateway API', sublabel: '(Istio/Envoy)', color: '#58a6ff', fs: 24 },
  extproc: { x: 300, y: 260, w: 550, h: 90, label: 'Envoy ext-proc', sublabel: '(gRPC hook)', color: '#d2a8ff', fs: 22 },
  epp: { x: 920, y: 260, w: 280, h: 90, label: 'EPP', sublabel: '(Endpoint Picker)', color: '#79c0ff', fs: 22 },
  kvindex: { x: 1270, y: 260, w: 210, h: 90, label: 'KV Index', sublabel: '(Cache tracker)', color: '#f0883e', fs: 18 },
  poolBoundary: { x: 280, y: 420, w: 1220, h: 240, type: 'boundary', label: 'InferencePool' },
  vllmPodA: { x: 320, y: 470, w: 340, h: 130, label: 'vLLM Pod A', sublabel: 'Cache hit: 85%', color: '#d2a8ff', fs: 20 },
  vllmPodB: { x: 720, y: 470, w: 340, h: 130, label: 'vLLM Pod B', sublabel: 'Least loaded', color: '#d2a8ff', fs: 20 },
  vllmPodC: { x: 1120, y: 470, w: 340, h: 130, label: 'vLLM Pod C', sublabel: 'Low cache hit', color: '#d2a8ff', fs: 20 },
  kvstore: { x: 1120, y: 720, w: 340, h: 100, label: 'KV Cache Store', sublabel: '(Persistent)', color: '#f0883e', fs: 18 },
  prefillPool: { x: 320, y: 880, w: 340, h: 130, label: 'Prefill Pool', sublabel: '(vLLM - TP=2)', color: '#d2a8ff', fs: 20 },
  nixl: { x: 720, y: 900, w: 340, h: 90, label: 'NIXL Transfer', sublabel: '(GPU-GPU RDMA)', color: '#8b949e', fs: 18 },
  decodePool: { x: 1120, y: 880, w: 340, h: 130, label: 'Decode Pool', sublabel: '(vLLM - TP=8)', color: '#d2a8ff', fs: 20 }
};

// Flow definitions with offset arrows (AI Gateway pattern)
const flows = {
  'cache-hit': {
    steps: [
      { nodes: ['user'], desc: 'Client sends POST /v1/completions', req: true },
      { nodes: ['user', 'gateway'], desc: 'Gateway receives request', arrow: true, num: 1, fromRight: true, toLeft: true, yOff: -8 },
      { nodes: ['gateway', 'extproc'], desc: 'Envoy calls ext-proc', arrow: true, num: 2, fromBottom: true, fromXOff: -150, toTop: true, toXOff: -80 },
      { nodes: ['extproc', 'epp'], desc: 'ext-proc → EPP', arrow: true, num: 3 },
      { nodes: ['epp', 'kvindex'], desc: 'EPP queries KV Index', arrow: true, num: 4 },
      { nodes: ['kvindex'], desc: 'Returns: Pod A (85%), Pod B (12%)', highlight: true },
      { nodes: ['epp'], desc: 'EPP scores → Pod A wins' },
      { nodes: ['epp', 'vllmPodA'], desc: 'Routes to Pod A', arrow: true, num: 5, fromBottom: true, toTop: true },
      { nodes: ['vllmPodA'], desc: 'Serves with 85% cached KV', highlight: true },
      { nodes: ['vllmPodA', 'gateway'], desc: 'Response to gateway', arrow: true, resp: true, num: 6, fromTop: true, toBottom: true, toXOff: -200 },
      { nodes: ['gateway', 'user'], desc: 'Stream tokens to client', arrow: true, resp: true, num: 7, fromLeft: true, toRight: true, yOff: 8 }
    ]
  },
  'cache-miss': {
    steps: [
      { nodes: ['user'], desc: 'Client sends request', req: true },
      { nodes: ['user', 'gateway'], desc: 'Gateway receives', arrow: true, num: 1, fromRight: true, toLeft: true, yOff: -8 },
      { nodes: ['gateway', 'extproc'], desc: 'Envoy → ext-proc', arrow: true, num: 2, fromBottom: true, fromXOff: -150, toTop: true, toXOff: -80 },
      { nodes: ['extproc', 'epp'], desc: 'ext-proc → EPP', arrow: true, num: 3 },
      { nodes: ['epp', 'kvindex'], desc: 'Query KV Index', arrow: true, num: 4 },
      { nodes: ['kvindex'], desc: 'Low scores: all < 5%', highlight: true },
      { nodes: ['epp'], desc: 'Fallback: least-loaded' },
      { nodes: ['epp', 'vllmPodB'], desc: 'Route to Pod B', arrow: true, num: 5, fromBottom: true, toTop: true },
      { nodes: ['vllmPodB'], desc: 'Full prefill required', highlight: true },
      { nodes: ['vllmPodB', 'kvstore'], desc: 'Publish BlockStored events', arrow: true, num: 6, fromRight: true, toLeft: true },
      { nodes: ['vllmPodB', 'gateway'], desc: 'Response to gateway', arrow: true, resp: true, num: 7, fromTop: true, toBottom: true, toXOff: -100 },
      { nodes: ['gateway', 'user'], desc: 'Stream to client', arrow: true, resp: true, num: 8, fromLeft: true, toRight: true, yOff: 8 }
    ]
  },
  'disaggregated': {
    steps: [
      { nodes: ['user'], desc: 'Client sends long prompt', req: true },
      { nodes: ['user', 'gateway'], desc: 'Gateway receives', arrow: true, num: 1, fromRight: true, toLeft: true, yOff: -8 },
      { nodes: ['gateway', 'extproc'], desc: 'Envoy → ext-proc', arrow: true, num: 2, fromBottom: true, fromXOff: -150, toTop: true, toXOff: -80 },
      { nodes: ['extproc', 'epp'], desc: 'ext-proc → EPP', arrow: true, num: 3 },
      { nodes: ['epp', 'prefillPool'], desc: 'Route to prefill pool', arrow: true, num: 4, fromBottom: true, toTop: true },
      { nodes: ['prefillPool'], desc: 'Compute KV cache', highlight: true },
      { nodes: ['prefillPool', 'nixl'], desc: 'KVXfer metadata', arrow: true, num: 5, fromRight: true, toLeft: true, yOff: -8 },
      { nodes: ['nixl'], desc: 'GPU-GPU RDMA transfer', highlight: true },
      { nodes: ['nixl', 'decodePool'], desc: 'KV cache pulled', arrow: true, num: 6, fromRight: true, toLeft: true, yOff: 8 },
      { nodes: ['decodePool'], desc: 'Autoregressive decode', highlight: true },
      { nodes: ['decodePool', 'gateway'], desc: 'Response to gateway', arrow: true, resp: true, num: 7, fromTop: true, toBottom: true, toXOff: 200 },
      { nodes: ['gateway', 'user'], desc: 'Stream to client', arrow: true, resp: true, num: 8, fromLeft: true, toRight: true, yOff: 8 }
    ]
  }
};

function resize() {
  W = canvas.width = window.innerWidth - 380;
  H = canvas.height = window.innerHeight;
  sc = Math.min(W / LW, H / LH) * 0.92;
  ox = (W - LW * sc) / 2;
  draw();
}

function C() {
  return isDark
    ? { bg:'#0d1117', bdr:'#30363d', txt:'#c9d1d9', dim:'#8b949e' }
    : { bg:'#fff', bdr:'#d0d7de', txt:'#24292f', dim:'#656d76' };
}

function edgePt(n, tx, ty, yo) {
  const cx = n.x + n.w/2, cy = n.y + n.h/2;
  const dx = tx - cx, dy = ty - cy;
  const hw = n.w/2, hh = n.h/2;
  let ex, ey;
  if (Math.abs(dx) * hh > Math.abs(dy) * hw) {
    ex = cx + (dx > 0 ? hw : -hw);
    ey = cy + dy * (hw / Math.abs(dx));
  } else {
    ey = cy + (dy > 0 ? hh : -hh);
    ex = cx + dx * (hh / Math.abs(dy));
  }
  return { x: ex, y: ey + (yo || 0) };
}

function resolveEdge(n, opts, isFrom) {
  const yo = opts.yOff || 0;
  const xo = opts.xOff || 0;
  if (isFrom) {
    if (opts.fromLeft) return { x: n.x, y: n.y + n.h/2 + yo };
    if (opts.fromRight) return { x: n.x + n.w, y: n.y + n.h/2 + yo };
    if (opts.fromBottom) return { x: n.x + n.w/2 + (opts.fromXOff || xo), y: n.y + n.h + yo };
    if (opts.fromTop) return { x: n.x + n.w/2 + (opts.fromXOff || xo), y: n.y + yo };
  } else {
    if (opts.toLeft) return { x: n.x, y: n.y + n.h/2 + yo };
    if (opts.toRight) return { x: n.x + n.w, y: n.y + n.h/2 + yo };
    if (opts.toBottom) return { x: n.x + n.w/2 + (opts.toXOff || xo), y: n.y + n.h + yo };
    if (opts.toTop) return { x: n.x + n.w/2 + (opts.toXOff || xo), y: n.y + yo };
  }
  return null;
}

function drawArrow(fromKey, toKey, opts) {
  const from = N[fromKey], to = N[toKey];
  if (!from || !to) return;

  let p1 = resolveEdge(from, opts, true);
  let p2 = resolveEdge(to, opts, false);

  if (!p1) {
    const tcx = to.x + to.w/2, tcy = to.y + to.h/2;
    p1 = edgePt(from, tcx, tcy, opts.yOff || 0);
  }
  if (!p2) {
    const fcx = from.x + from.w/2, fcy = from.y + from.h/2;
    p2 = edgePt(to, fcx, fcy, opts.yOff || 0);
  }

  ctx.save();
  ctx.globalAlpha = 0.9;

  const color = opts.resp ? '#3fb950' : '#58a6ff';

  // Line
  ctx.beginPath();
  ctx.moveTo(tx(p1.x), ty(p1.y));
  ctx.lineTo(tx(p2.x), ty(p2.y));
  ctx.strokeStyle = color;
  ctx.lineWidth = ts(2.5);
  ctx.stroke();

  // Arrowhead
  const ang = Math.atan2(p2.y - p1.y, p2.x - p1.x);
  const sz = ts(10);
  ctx.beginPath();
  ctx.moveTo(tx(p2.x), ty(p2.y));
  ctx.lineTo(tx(p2.x) - sz * Math.cos(ang - 0.4), ty(p2.y) - sz * Math.sin(ang - 0.4));
  ctx.lineTo(tx(p2.x) - sz * Math.cos(ang + 0.4), ty(p2.y) - sz * Math.sin(ang + 0.4));
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();

  // Number
  if (opts.num != null) {
    const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
    const r = ts(12);
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(tx(mx), ty(my), r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.font = `bold ${ts(10)}px system-ui`;
    ctx.fillStyle = isDark ? '#0d1117' : '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(opts.num), tx(mx), ty(my));
  }

  ctx.restore();
}

function drawNode(key, active, highlight) {
  const n = N[key];
  const c = C();

  if (n.type === 'boundary') {
    ctx.strokeStyle = c.bdr;
    ctx.setLineDash([ts(6), ts(5)]);
    ctx.lineWidth = ts(2);
    ctx.strokeRect(tx(n.x), ty(n.y), ts(n.w), ts(n.h));
    ctx.setLineDash([]);
    ctx.fillStyle = c.dim;
    ctx.font = `${ts(13)}px system-ui`;
    ctx.textAlign = 'left';
    ctx.fillText(n.label, tx(n.x + 12), ty(n.y - 10));
    return;
  }

  ctx.save();
  ctx.globalAlpha = active ? 1 : 0.35;

  const x = tx(n.x), y = ty(n.y), w = ts(n.w), h = ts(n.h), r = ts(8);

  ctx.fillStyle = n.color;
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.fill();

  if (highlight) {
    ctx.strokeStyle = n.color;
    ctx.lineWidth = ts(3);
    ctx.shadowBlur = ts(24);
    ctx.shadowColor = n.color;
    ctx.stroke();
  } else if (active) {
    ctx.strokeStyle = n.color;
    ctx.lineWidth = ts(2);
    ctx.stroke();
  }
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const fs = n.fs || 16;
  ctx.font = `bold ${ts(fs)}px system-ui`;
  const cy = n.sublabel ? y + h/2 - ts(12) : y + h/2;
  ctx.fillText(n.label, x + w/2, cy);

  if (n.sublabel) {
    ctx.font = `${ts(fs * 0.7)}px system-ui`;
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillText(n.sublabel, x + w/2, cy + ts(20));
  }

  ctx.restore();
}

function draw() {
  const c = C();
  ctx.fillStyle = c.bg;
  ctx.fillRect(0, 0, W, H);

  const flow = flows[currentFlow];
  const activeNodes = new Set();
  const arrows = [];
  let highlightNodes = new Set();

  for (let i = 0; i <= stepIdx; i++) {
    const step = flow.steps[i];
    step.nodes.forEach(n => activeNodes.add(n));
    if (step.arrow && step.nodes.length === 2) {
      arrows.push({ from: step.nodes[0], to: step.nodes[1], opts: step });
    }
    if (i === stepIdx && step.highlight) {
      step.nodes.forEach(n => highlightNodes.add(n));
    }
  }

  ['cluster', 'poolBoundary'].forEach(key => {
    if (N[key]) drawNode(key, true, false);
  });

  Object.keys(N).forEach(key => {
    if (N[key].type !== 'boundary') {
      drawNode(key, activeNodes.has(key), highlightNodes.has(key));
    }
  });

  arrows.forEach(({ from, to, opts }) => drawArrow(from, to, opts));
}

function updateUI() {
  const flow = flows[currentFlow];
  const stepsList = document.getElementById('stepsList');
  stepsList.innerHTML = '';
  flow.steps.forEach((step, i) => {
    const div = document.createElement('div');
    div.className = 'step ' + (i < stepIdx ? 'done' : i === stepIdx ? 'active' : 'pending');
    div.innerHTML = `<span class="step-mk"></span><span>${step.desc}</span>`;
    div.onclick = () => { stepIdx = i; updateUI(); draw(); };
    stepsList.appendChild(div);
  });

  const inspector = document.getElementById('inspector');
  const step = flow.steps[stepIdx];
  let html = '';

  if (step.req) {
    html += '<div class="insp-sec">Request:</div>';
    html += '<div class="insp-line">POST /v1/completions HTTP/2</div>';
    html += '<div class="insp-line">Host: llm-d-gateway.cluster.local</div>';
    html += '<div class="insp-line">Content-Type: application/json</div>';
  } else if (step.resp) {
    html += '<div class="insp-sec">Response:</div>';
    html += '<div class="insp-line">HTTP/2 200 OK</div>';
    html += '<div class="insp-line">Content-Type: text/event-stream</div>';
  } else {
    html += `<div class="insp-sec">Step ${stepIdx + 1}:</div>`;
    html += `<div class="insp-line">${step.desc}</div>`;
  }

  inspector.innerHTML = html;
  draw();
}

function changeFlow() {
  currentFlow = document.getElementById('flowSel').value;
  stepIdx = 0;
  updateUI();
}

function togglePlay() {
  running = !running;
  document.getElementById('playBtn').textContent = running ? '⏸ Pause' : '▶ Start';
  if (running) animate();
}

function reset() {
  running = false;
  stepIdx = 0;
  document.getElementById('playBtn').textContent = '▶ Start';
  updateUI();
}

function changeSpeed(e) {
  playbackSpeed = parseFloat(e.target.value);
}

function animate() {
  if (!running) return;
  const flow = flows[currentFlow];
  if (stepIdx < flow.steps.length - 1) {
    stepTimer = setTimeout(() => {
      stepIdx++;
      updateUI();
      animate();
    }, 1200 / playbackSpeed);
  } else {
    running = false;
    document.getElementById('playBtn').textContent = '▶ Start';
  }
}

function toggleTheme() {
  isDark = !isDark;
  document.body.classList.toggle('light');
  document.getElementById('thm').textContent = isDark ? '☾' : '☀';
  draw();
}

window.addEventListener('resize', resize);
resize();
updateUI();
</script>
</body>
</html>
