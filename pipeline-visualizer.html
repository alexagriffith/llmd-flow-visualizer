<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>llmd Pipeline Visualizer — Request Flow Animation</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0f;
    color: #e2e8f0;
    overflow: hidden;
}
#container {
    display: flex;
    height: 100vh;
}
#canvas-wrapper {
    flex: 1;
    position: relative;
    overflow: auto;
}
canvas {
    display: block;
    background: #0a0a0f;
}
#controls {
    position: fixed;
    top: 20px;
    left: 20px;
    background: #161b22;
    padding: 20px;
    border-radius: 12px;
    border: 1px solid #21262d;
    z-index: 100;
    backdrop-filter: blur(10px);
    max-width: 320px;
}
#controls h1 {
    font-size: 18px;
    margin-bottom: 15px;
    color: #58a6ff;
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
}
.flow-selector {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 20px;
}
.flow-btn {
    padding: 10px 14px;
    background: #0d1117;
    border: 1px solid #21262d;
    border-radius: 8px;
    color: #e2e8f0;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    font-size: 12px;
}
.flow-btn:hover {
    background: #161b22;
    border-color: #58a6ff44;
}
.flow-btn.active {
    background: #58a6ff22;
    border-color: #58a6ff;
    color: #58a6ff;
}
.flow-btn strong {
    display: block;
    margin-bottom: 3px;
    font-size: 13px;
}
.playback-controls {
    display: flex;
    gap: 6px;
    margin-bottom: 15px;
}
.control-btn {
    padding: 7px 11px;
    background: #0d1117;
    border: 1px solid #21262d;
    border-radius: 6px;
    color: #e2e8f0;
    cursor: pointer;
    font-size: 11px;
    transition: all 0.2s;
    flex: 1;
}
.control-btn:hover {
    background: #161b22;
    border-color: #58a6ff44;
}
.control-btn.primary {
    background: #58a6ff;
    border-color: #58a6ff;
    color: #0a0a0f;
    font-weight: 600;
}
.step-info {
    background: #0d1117;
    border: 1px solid #21262d;
    border-radius: 8px;
    padding: 12px;
    margin-top: 15px;
    font-size: 12px;
    line-height: 1.5;
}
.step-info strong {
    color: #58a6ff;
    display: block;
    margin-bottom: 6px;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}
.theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 8px 12px;
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 6px;
    color: #e2e8f0;
    cursor: pointer;
    font-size: 11px;
    z-index: 100;
}
.theme-toggle:hover {
    border-color: #58a6ff44;
}
body.light {
    background: #f6f8fa;
    color: #24292f;
}
body.light canvas {
    background: #f6f8fa;
}
body.light #controls,
body.light .theme-toggle {
    background: #ffffff;
    border-color: #d0d7de;
}
body.light #controls h1 {
    color: #0969da;
}
body.light .flow-btn,
body.light .control-btn,
body.light .step-info {
    background: #f6f8fa;
    border-color: #d0d7de;
    color: #24292f;
}
body.light .flow-btn.active {
    background: #ddf4ff;
    border-color: #0969da;
    color: #0969da;
}
body.light .control-btn.primary {
    background: #0969da;
    color: white;
}
</style>
</head>
<body>
<div id="container">
    <div id="canvas-wrapper">
        <canvas id="canvas"></canvas>
    </div>
</div>

<div id="controls">
    <h1>llmd Pipeline Flows</h1>

    <div class="flow-selector">
        <button class="flow-btn active" data-flow="primary-success">
            <strong>Primary Model Success</strong>
            <span>Request routed to primary vLLM endpoint, completes successfully</span>
        </button>
        <button class="flow-btn" data-flow="fallback-timeout">
            <strong>Fallback on Timeout</strong>
            <span>Primary times out (5s) → OpenAI fallback activated</span>
        </button>
        <button class="flow-btn" data-flow="load-balance">
            <strong>Load Balanced</strong>
            <span>Weighted round-robin across 3 Ollama models</span>
        </button>
        <button class="flow-btn" data-flow="speculative">
            <strong>Speculative Decoding</strong>
            <span>Draft model (8B) → Target model (70B) with acceptance</span>
        </button>
        <button class="flow-btn" data-flow="cascade">
            <strong>5-Tier Cascade</strong>
            <span>Local → Anthropic → OpenAI → Bedrock → Vertex</span>
        </button>
    </div>

    <div class="playback-controls">
        <button class="control-btn primary" id="playBtn">▶ Play</button>
        <button class="control-btn" id="pauseBtn">⏸ Pause</button>
        <button class="control-btn" id="resetBtn">↻ Reset</button>
    </div>

    <div class="step-info">
        <strong>Current Step</strong>
        <div id="stepDesc">Select a flow and click Play to begin animation</div>
    </div>
</div>

<button class="theme-toggle" onclick="toggleTheme()">🌙 Dark / ☀️ Light</button>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Canvas sizing
const W = 1800;
const H = 1400;
canvas.width = W;
canvas.height = H;

// Theme
let isDark = true;
function toggleTheme() {
    isDark = !isDark;
    document.body.classList.toggle('light');
    draw();
}

// Component positions (grid-based layout)
const N = {
    client: { x: 200, y: 200, w: 220, h: 80, label: 'HTTP Client', color: '#58a6ff' },
    llmd: { x: 600, y: 200, w: 240, h: 120, label: 'llmd Daemon', color: '#58a6ff', sub: 'Orchestrator' },

    // Routing components (nested inside llmd conceptually, but shown separately)
    router: { x: 600, y: 400, w: 240, h: 80, label: 'Route Matcher', color: '#d2a8ff' },
    selector: { x: 600, y: 540, w: 240, h: 80, label: 'Model Selector', color: '#d2a8ff' },
    loadbal: { x: 600, y: 680, w: 240, h: 80, label: 'Load Balancer', color: '#f0883e' },

    // Backend models
    vllm: { x: 1100, y: 300, w: 200, h: 80, label: 'vLLM (70B)', color: '#3fb950', sub: 'Primary' },
    ollama1: { x: 1100, y: 440, w: 200, h: 70, label: 'Ollama (Llama-8B)', color: '#3fb950', sub: 'Weight: 3' },
    ollama2: { x: 1100, y: 530, w: 200, h: 70, label: 'Ollama (Mistral-7B)', color: '#3fb950', sub: 'Weight: 2' },
    ollama3: { x: 1100, y: 620, w: 200, h: 70, label: 'Ollama (Phi-3)', color: '#3fb950', sub: 'Weight: 1' },

    openai: { x: 1100, y: 740, w: 200, h: 80, label: 'OpenAI (GPT-4o)', color: '#e3b341', sub: 'Fallback' },
    anthropic: { x: 1100, y: 840, w: 200, h: 80, label: 'Anthropic (Claude)', color: '#e3b341', sub: 'Fallback L2' },

    // Spec decode components
    draft: { x: 1100, y: 300, w: 200, h: 70, label: 'Draft (Llama-8B)', color: '#79c0ff' },
    target: { x: 1100, y: 390, w: 200, h: 70, label: 'Target (Llama-70B)', color: '#79c0ff' },

    // Observability
    otel: { x: 1100, y: 1000, w: 200, h: 80, label: 'OTEL Collector', color: '#8b949e', sub: 'Traces/Metrics' }
};

// Flows
const flows = {
    'primary-success': {
        steps: [
            { nodes: ['client'], desc: 'Client sends POST /v1/completions', num: 1 },
            { nodes: ['client', 'llmd'], desc: 'Request arrives at llmd daemon', arrow: true, num: 2 },
            { nodes: ['llmd'], desc: 'Parse request, extract model/prompt', num: 3 },
            { nodes: ['llmd', 'router'], desc: 'Route to configured endpoint', arrow: true, num: 4 },
            { nodes: ['router', 'selector'], desc: 'Select primary model (vLLM)', arrow: true, num: 5 },
            { nodes: ['selector', 'vllm'], desc: 'Forward to vLLM backend', arrow: true, num: 6 },
            { nodes: ['vllm'], desc: 'vLLM processes request (TTFT: 120ms)', num: 7 },
            { nodes: ['vllm', 'llmd'], desc: 'Stream tokens back to daemon', arrow: true, resp: true, num: 8 },
            { nodes: ['llmd', 'otel'], desc: 'Emit metrics (latency, tokens)', arrow: true, num: 9 },
            { nodes: ['llmd', 'client'], desc: 'Proxy response stream to client', arrow: true, resp: true, num: 10 }
        ]
    },
    'fallback-timeout': {
        steps: [
            { nodes: ['client'], desc: 'Client sends POST /v1/completions', num: 1 },
            { nodes: ['client', 'llmd'], desc: 'Request arrives at llmd', arrow: true, num: 2 },
            { nodes: ['llmd', 'router'], desc: 'Route to primary (vLLM)', arrow: true, num: 3 },
            { nodes: ['router', 'vllm'], desc: 'Forward to vLLM (timeout: 5s)', arrow: true, num: 4 },
            { nodes: ['vllm'], desc: '⏱️ Timeout after 5s (no response)', num: 5 },
            { nodes: ['router'], desc: '🔄 Trigger fallback chain', num: 6 },
            { nodes: ['router', 'openai'], desc: 'Retry with OpenAI fallback', arrow: true, num: 7 },
            { nodes: ['openai'], desc: 'OpenAI processes request (TTFT: 800ms)', num: 8 },
            { nodes: ['openai', 'llmd'], desc: 'Stream tokens back', arrow: true, resp: true, num: 9 },
            { nodes: ['llmd', 'client'], desc: 'Proxy to client (marked as fallback)', arrow: true, resp: true, num: 10 }
        ]
    },
    'load-balance': {
        steps: [
            { nodes: ['client'], desc: '3 concurrent requests arrive', num: 1 },
            { nodes: ['client', 'llmd'], desc: 'Requests queued in daemon', arrow: true, num: 2 },
            { nodes: ['llmd', 'loadbal'], desc: 'Load balancer selects backends', arrow: true, num: 3 },
            { nodes: ['loadbal', 'ollama1'], desc: 'Request 1 → Ollama-1 (weight 3)', arrow: true, num: 4 },
            { nodes: ['loadbal', 'ollama2'], desc: 'Request 2 → Ollama-2 (weight 2)', arrow: true, num: 5 },
            { nodes: ['loadbal', 'ollama3'], desc: 'Request 3 → Ollama-3 (weight 1)', arrow: true, num: 6 },
            { nodes: ['ollama1', 'ollama2', 'ollama3'], desc: 'All 3 models process in parallel', num: 7 },
            { nodes: ['ollama1', 'llmd'], desc: 'Response 1 streams back', arrow: true, resp: true, num: 8 },
            { nodes: ['llmd', 'client'], desc: 'All responses proxied to clients', arrow: true, resp: true, num: 9 }
        ]
    },
    'speculative': {
        steps: [
            { nodes: ['client'], desc: 'Client sends /v1/completions', num: 1 },
            { nodes: ['client', 'llmd'], desc: 'Request arrives with spec-decode enabled', arrow: true, num: 2 },
            { nodes: ['llmd', 'draft'], desc: 'Send to draft model (Llama-8B)', arrow: true, num: 3 },
            { nodes: ['draft'], desc: 'Draft generates 4 candidate tokens (fast)', num: 4 },
            { nodes: ['draft', 'target'], desc: 'Forward draft + candidates to target', arrow: true, num: 5 },
            { nodes: ['target'], desc: 'Target model verifies candidates (Llama-70B)', num: 6 },
            { nodes: ['target'], desc: '✅ Accept 3/4 tokens (75% acceptance)', num: 7 },
            { nodes: ['target', 'llmd'], desc: 'Return accepted tokens + next draft', arrow: true, resp: true, num: 8 },
            { nodes: ['llmd'], desc: 'Loop until EOS (3x speedup vs target-only)', num: 9 },
            { nodes: ['llmd', 'client'], desc: 'Stream final response', arrow: true, resp: true, num: 10 }
        ]
    },
    'cascade': {
        steps: [
            { nodes: ['client'], desc: 'Client sends /v1/completions', num: 1 },
            { nodes: ['client', 'llmd'], desc: 'Request arrives at daemon', arrow: true, num: 2 },
            { nodes: ['llmd', 'vllm'], desc: 'Try L1: Local vLLM (timeout: 3s)', arrow: true, num: 3 },
            { nodes: ['vllm'], desc: '❌ Timeout (pod down)', num: 4 },
            { nodes: ['llmd', 'anthropic'], desc: 'Try L2: Anthropic (timeout: 10s)', arrow: true, num: 5 },
            { nodes: ['anthropic'], desc: '❌ 429 Rate limit', num: 6 },
            { nodes: ['llmd', 'openai'], desc: 'Try L3: OpenAI (timeout: 10s)', arrow: true, num: 7 },
            { nodes: ['openai'], desc: '✅ Success! GPT-4o responds', num: 8 },
            { nodes: ['openai', 'llmd'], desc: 'Stream tokens back', arrow: true, resp: true, num: 9 },
            { nodes: ['llmd', 'otel'], desc: 'Log cascade depth: 3 (for alerting)', arrow: true, num: 10 },
            { nodes: ['llmd', 'client'], desc: 'Proxy to client', arrow: true, resp: true, num: 11 }
        ]
    }
};

// State
let currentFlow = 'primary-success';
let currentStep = 0;
let isPlaying = false;
let animationInterval = null;

// Draw arrow with numbered dot
function drawArrow(fromKey, toKey, stepNum, isResponse) {
    const from = N[fromKey];
    const to = N[toKey];
    if (!from || !to) return;

    const x1 = from.x + from.w / 2;
    const y1 = from.y + from.h / 2;
    const x2 = to.x + to.w / 2;
    const y2 = to.y + to.h / 2;

    const arrowColor = isResponse ? '#3fb950' : '#58a6ff';

    ctx.globalAlpha = 0.9;
    ctx.strokeStyle = isDark ? arrowColor : (isResponse ? '#1a7f37' : '#0969da');
    ctx.lineWidth = 3;
    ctx.setLineDash([]);

    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();

    // Arrowhead
    const angle = Math.atan2(y2 - y1, x2 - x1);
    const headLen = 12;
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - headLen * Math.cos(angle - Math.PI / 6), y2 - headLen * Math.sin(angle - Math.PI / 6));
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - headLen * Math.cos(angle + Math.PI / 6), y2 - headLen * Math.sin(angle + Math.PI / 6));
    ctx.stroke();

    // Numbered dot
    if (stepNum != null) {
        const mx = (x1 + x2) / 2;
        const my = (y1 + y2) / 2;
        const r = 14;

        ctx.globalAlpha = 1;
        ctx.beginPath();
        ctx.arc(mx, my, r, 0, Math.PI * 2);
        ctx.fillStyle = isDark ? arrowColor : (isResponse ? '#1a7f37' : '#0969da');
        ctx.fill();

        ctx.font = 'bold 11px system-ui';
        ctx.fillStyle = isDark ? '#0d1117' : '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(String(stepNum), mx, my);
    }
}

// Draw node
function drawNode(key, isActive) {
    const node = N[key];
    if (!node) return;

    const colors = {
        '#58a6ff': { border: '#58a6ff', bg: '#58a6ff22', text: '#58a6ff' },
        '#d2a8ff': { border: '#d2a8ff', bg: '#d2a8ff22', text: '#d2a8ff' },
        '#f0883e': { border: '#f0883e', bg: '#f0883e22', text: '#f0883e' },
        '#3fb950': { border: '#3fb950', bg: '#3fb95022', text: '#3fb950' },
        '#e3b341': { border: '#e3b341', bg: '#e3b34122', text: '#e3b341' },
        '#79c0ff': { border: '#79c0ff', bg: '#79c0ff22', text: '#79c0ff' },
        '#8b949e': { border: '#8b949e', bg: '#8b949e22', text: '#8b949e' }
    };

    const c = colors[node.color] || colors['#58a6ff'];

    // Light theme adjustments
    if (!isDark) {
        c.border = node.color === '#58a6ff' ? '#0969da' :
                   node.color === '#3fb950' ? '#1a7f37' :
                   node.color === '#d2a8ff' ? '#8250df' : c.border;
        c.bg = isDark ? c.bg : '#f6f8fa';
        c.text = c.border;
    }

    ctx.globalAlpha = 1;
    ctx.fillStyle = isActive ? (isDark ? c.border + '44' : '#ddf4ff') : c.bg;
    ctx.strokeStyle = isActive ? c.border : (isDark ? '#21262d' : '#d0d7de');
    ctx.lineWidth = isActive ? 2.5 : 1.5;
    ctx.setLineDash([]);

    // Rounded rect
    const r = 8;
    ctx.beginPath();
    ctx.moveTo(node.x + r, node.y);
    ctx.lineTo(node.x + node.w - r, node.y);
    ctx.quadraticCurveTo(node.x + node.w, node.y, node.x + node.w, node.y + r);
    ctx.lineTo(node.x + node.w, node.y + node.h - r);
    ctx.quadraticCurveTo(node.x + node.w, node.y + node.h, node.x + node.w - r, node.y + node.h);
    ctx.lineTo(node.x + r, node.y + node.h);
    ctx.quadraticCurveTo(node.x, node.y + node.h, node.x, node.y + node.h - r);
    ctx.lineTo(node.x, node.y + r);
    ctx.quadraticCurveTo(node.x, node.y, node.x + r, node.y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Label
    ctx.font = 'bold 13px system-ui';
    ctx.fillStyle = isDark ? c.text : c.border;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(node.label, node.x + node.w / 2, node.y + node.h / 2 - (node.sub ? 8 : 0));

    // Subtitle
    if (node.sub) {
        ctx.font = '11px system-ui';
        ctx.fillStyle = isDark ? '#8b949e' : '#57606a';
        ctx.fillText(node.sub, node.x + node.w / 2, node.y + node.h / 2 + 10);
    }
}

// Main draw
function draw() {
    ctx.clearRect(0, 0, W, H);

    const flow = flows[currentFlow];
    if (!flow) return;

    const step = flow.steps[currentStep];

    // Draw all nodes
    Object.keys(N).forEach(key => {
        const isActive = step && step.nodes.includes(key);
        drawNode(key, isActive);
    });

    // Draw arrows for completed steps
    for (let i = 0; i <= currentStep; i++) {
        const s = flow.steps[i];
        if (s && s.arrow && s.nodes.length === 2) {
            drawArrow(s.nodes[0], s.nodes[1], s.num, s.resp);
        }
    }

    // Update step description
    if (step) {
        document.getElementById('stepDesc').textContent = `Step ${currentStep + 1}/${flow.steps.length}: ${step.desc}`;
    }
}

// Playback controls
function play() {
    if (isPlaying) return;
    isPlaying = true;
    animationInterval = setInterval(() => {
        currentStep++;
        if (currentStep >= flows[currentFlow].steps.length) {
            pause();
            currentStep = flows[currentFlow].steps.length - 1;
        }
        draw();
    }, 1500);
}

function pause() {
    isPlaying = false;
    if (animationInterval) {
        clearInterval(animationInterval);
        animationInterval = null;
    }
}

function reset() {
    pause();
    currentStep = 0;
    draw();
}

// Event listeners
document.getElementById('playBtn').addEventListener('click', play);
document.getElementById('pauseBtn').addEventListener('click', pause);
document.getElementById('resetBtn').addEventListener('click', reset);

document.querySelectorAll('.flow-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.flow-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFlow = btn.dataset.flow;
        reset();
    });
});

// Initial draw
draw();
</script>
</body>
</html>
