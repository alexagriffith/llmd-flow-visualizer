<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM-D Architecture — Flow Visualizer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9;overflow:hidden;transition:background .3s,color .3s}
body.light{background:#fff;color:#24292f}

.right-panel{position:fixed;top:0;right:0;width:380px;height:100vh;z-index:100;display:flex;flex-direction:column;background:#161b22;border-left:1px solid #30363d;overflow:hidden;transition:background .3s,border-color .3s}
body.light .right-panel{background:#f6f8fa;border-color:#d0d7de}

.flow-bar{padding:12px 16px;border-bottom:1px solid #30363d;flex-shrink:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
body.light .flow-bar{border-color:#d0d7de}
.flow-bar select{flex:1;padding:7px 10px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;font-size:13px;font-family:inherit;cursor:pointer}
body.light .flow-bar select{background:#fff;color:#24292f;border-color:#d0d7de}
.flow-bar button{padding:7px 14px;border:1px solid #30363d;border-radius:6px;background:#161b22;color:#c9d1d9;cursor:pointer;font-size:13px;font-family:inherit;transition:all .15s}
body.light .flow-bar button{background:#f6f8fa;color:#24292f;border-color:#d0d7de}
.flow-bar button:hover{border-color:#58a6ff}
.flow-bar .start{border-color:#3fb950;color:#3fb950;min-width:90px}
.flow-bar .rst{border-color:#f0883e;color:#f0883e}

.steps-section{padding:10px 16px;border-bottom:1px solid #30363d;flex:2;overflow-y:auto}
body.light .steps-section{border-color:#d0d7de}
.steps-title{font-weight:700;margin-bottom:6px;font-size:14px}
.step{margin:2px 0;color:#484f58;display:flex;align-items:flex-start;gap:6px;font-size:12px;line-height:1.4;cursor:pointer;padding:3px 4px;border-radius:4px;transition:all .2s}
body.light .step{color:#b0b8c1}
.step:hover{background:#58a6ff22;cursor:pointer;color:#58a6ff;transform:translateX(4px);border-left:2px solid #58a6ff;padding-left:6px}
.step-mk{flex-shrink:0;width:16px;text-align:center;font-size:13px}
.step.pending .step-mk::before{content:'\25CB'}
.step.active{color:#58a6ff}
.step.active .step-mk::before{content:'\25CF'}
.step.done{color:#3fb950}
.step.done .step-mk::before{content:'\2713'}

.insp-section{flex:3;overflow-y:auto;padding:10px 16px;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:11px}
.insp-title{font-weight:700;font-size:14px;margin-bottom:6px;font-family:-apple-system,sans-serif;padding:0 0 6px;border-bottom:1px solid #30363d}
body.light .insp-title{border-color:#d0d7de}
.insp-sec{margin:6px 0 2px;font-weight:600;color:#58a6ff;font-size:12px;font-family:-apple-system,sans-serif}
.insp-line{margin:1px 0;padding:2px 6px;border-radius:3px;white-space:pre-wrap;line-height:1.6;transition:all .4s;word-break:break-word}
.insp-line.add{background:#1a2e1a;color:#3fb950;border-left:3px solid #3fb950}
.insp-line.keep{color:#8b949e;border-left:3px solid transparent}
.insp-line.highlight{background:#1a2332;color:#58a6ff;border-left:3px solid #58a6ff}
.insp-plugin{margin:8px 0 4px;padding:4px 8px;background:#d2a8ff22;border-radius:4px;color:#d2a8ff;font-weight:600;font-size:12px;font-family:-apple-system,sans-serif}

.theme-toggle{position:fixed;top:16px;right:396px;z-index:200;width:36px;height:36px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#c9d1d9;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center}
body.light .theme-toggle{background:#f6f8fa;color:#24292f;border-color:#d0d7de}

.brand{position:fixed;top:10px;left:16px;z-index:200;display:flex;align-items:center;gap:10px;pointer-events:none}
.brand-icon{width:30px;height:30px;background:linear-gradient(135deg,#58a6ff,#d2a8ff);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#0a0a0f;font-size:16px}
.brand span{font-size:20px;font-weight:700;color:#fff}
body.light .brand span{color:#1a1a1a}

.viz-title{position:fixed;top:14px;left:0;right:380px;z-index:200;text-align:center;font-size:22px;font-weight:700;background:linear-gradient(135deg,#58a6ff,#d2a8ff,#f0883e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:-0.5px;pointer-events:none}

.legend{position:fixed;bottom:16px;left:16px;z-index:100;padding:10px 14px;background:#161b22;border:1px solid #30363d;border-radius:10px;font-size:13px}
body.light .legend{background:#f6f8fa;border-color:#d0d7de}
.legend-title{font-weight:600;margin-bottom:5px;font-size:14px}
.legend-item{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}
.legend-dot{width:11px;height:11px;border-radius:50%}

#highlight-box{display:none;position:fixed;z-index:350;border-radius:10px;pointer-events:none}
#overlay{display:none;position:fixed;top:0;left:0;right:380px;bottom:0;z-index:300;background:rgba(0,0,0,0.6)}
.overlay-card{position:absolute;background:#161b22ee;border:1px solid #30363d;border-radius:14px;max-width:420px;padding:22px 26px;box-shadow:0 12px 40px rgba(0,0,0,0.5);transition:opacity .2s}
.modal-close{position:absolute;top:10px;right:14px;background:none;border:none;color:#8b949e;font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:all .15s}
.modal-close:hover{color:#c9d1d9;background:#30363d}
.modal-title{margin:0 0 6px;font-size:18px;color:#c9d1d9;font-family:system-ui}
.modal-sub{margin:0 0 14px;font-size:13px;color:#8b949e;line-height:1.5;font-family:system-ui}
.modal-detail{margin:10px 0;padding:10px;background:#0d1117;border-radius:8px;font-size:13px;line-height:1.6}
.modal-detail strong{color:#58a6ff}

.steps-section::-webkit-scrollbar,.insp-section::-webkit-scrollbar{width:6px}
.steps-section::-webkit-scrollbar-thumb,.insp-section::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
</style>
</head>
<body>

<div class="brand"><div class="brand-icon">D</div><span>LLM-D</span></div>
<button class="theme-toggle" id="thm" onclick="toggleTheme()">☾</button>
<div class="viz-title">LLM-D Architecture — Disaggregated Serving Flow</div>

<div class="right-panel">
  <div class="flow-bar">
    <select id="flow-select">
      <option value="disaggregated">Disaggregated (Prefill/Decode)</option>
      <option value="unified">Unified (Single Pod)</option>
      <option value="multinode">Multi-Node Tensor Parallelism</option>
    </select>
    <button class="start" onclick="run()">▶ Start</button>
    <button onclick="stepOnce()" style="border-color:#58a6ff;color:#58a6ff;min-width:36px">▮▶</button>
    <button id="speed-btn" onclick="cycleSpeed()" style="min-width:36px">1x</button>
    <button class="rst" onclick="doReset()">Reset</button>
  </div>
  <div class="steps-section" id="steps-section">
    <div class="steps-title">Flow Steps <span style="font-weight:400;font-size:11px;color:#8b949e">· click to jump</span></div>
    <div id="steps-ctr"></div>
  </div>
  <div class="insp-section" id="insp-section">
    <div class="insp-title" id="insp-title" style="color:#58a6ff">Request</div>
    <div id="insp-content"></div>
  </div>
</div>

<div id="highlight-box"></div>
<div id="overlay" onclick="if(event.target===this)closeOverlay()">
  <div class="overlay-card" id="overlay-card">
    <button class="modal-close" onclick="closeOverlay()">✕</button>
    <div id="overlay-accent" style="width:4px;height:24px;border-radius:2px;position:absolute;left:0;top:22px"></div>
    <h2 id="overlay-title" class="modal-title"></h2>
    <p id="overlay-sub" class="modal-sub"></p>
    <div id="overlay-details"></div>
    <button onclick="closeOverlay()" style="margin-top:14px;padding:7px 20px;border:1px solid #3fb950;border-radius:8px;background:transparent;color:#3fb950;font-size:13px;cursor:pointer;font-family:system-ui;transition:all .15s" onmouseover="this.style.background='#3fb95022'" onmouseout="this.style.background='transparent'">▶ Resume Flow</button>
  </div>
</div>

<div class="legend">
  <div class="legend-title">Legend</div>
  <div class="legend-item"><div class="legend-dot" style="background:#58a6ff"></div>Request</div>
  <div class="legend-item"><div class="legend-dot" style="background:#3fb950"></div>Response</div>
  <div class="legend-item"><div class="legend-dot" style="background:#d2a8ff"></div>Prefill</div>
  <div class="legend-item"><div class="legend-dot" style="background:#79c0ff"></div>Decode/Worker</div>
  <div style="margin-top:10px;padding-top:8px;border-top:1px solid #30363d;font-size:11px;color:#484f58">Click components for details</div>
</div>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, isDark = true, animFrame = null, dots = [], activeNodes = new Set();
let badges = {}, lines = [], running = false, fading = {}, glowing = new Set();
let paused = false, runStepIndex = 0, stepTimer = null, playbackSpeed = 1;
let inspHeaders = [], inspBody = [], inspMeta = [], inspStepLabel = '';
let snapshots = [], highlightKey = null, overlayWasRunning = false;

const LW = 1350, LH = 1000;
let ox = 0, oy = 0, sc = 1;

function toggleTheme() {
  isDark = !isDark;
  document.body.classList.toggle('light', !isDark);
  document.getElementById('thm').innerHTML = isDark ? '☾' : '☀';
  draw();
}

// NODES - Data plane architecture (request path)
const N = {
  // Top row - all aligned at y=110
  user: { x: 60, y: 110, w: 100, h: 70, label: 'Client / Agent', type: 'icon' },
  gateway: { x: 240, y: 110, w: 450, h: 80, label: 'Gateway API', sublabel: 'Istio/Envoy', color: '#58a6ff', fs: 20 },

  // Kubernetes cluster boundary
  cluster: { x: 180, y: 60, w: 1140, h: 920, type: 'boundary' },

  // llm-d Router (data plane) - y=240
  router_box: { x: 200, y: 240, w: 520, h: 160, type: 'container', label: 'llm-d Router', color: '#79c0ff' },
  epp: { x: 220, y: 270, w: 230, h: 60, label: 'Endpoint Picker', sublabel: 'EPP (ext_proc)', color: '#79c0ff', fs: 14, inner: true },
  routing_policy: { x: 220, y: 340, w: 230, h: 50, label: 'Routing Policy', sublabel: 'KV-Cache Aware', color: '#8b949e', fs: 13, inner: true },
  autoscaler: { x: 470, y: 270, w: 230, h: 120, label: 'Workload Variant\nAutoscaler', sublabel: 'Queue-Based', color: '#e3b341', fs: 12, inner: true },

  // InferencePool (data plane) - horizontal layout
  inferencepool_box: { x: 200, y: 450, w: 880, h: 380, type: 'container', label: 'InferencePool', color: '#d2a8ff' },

  // Row 1 inside InferencePool: Sidecar - y=485
  sidecar: { x: 440, y: 485, w: 200, h: 60, label: 'Sidecar', sublabel: 'P/D Coordinator', color: '#8b949e', fs: 14, inner: true },

  // Row 2 inside InferencePool: Decode, NIXL, Prefill - all aligned at y=575
  decode: { x: 220, y: 575, w: 240, h: 90, label: 'vLLM Decode', sublabel: 'Pod A (L4/T4)', color: '#79c0ff', fs: 15, inner: true },
  nixl: { x: 490, y: 575, w: 200, h: 90, label: 'NIXL', sublabel: 'KV Transfer', color: '#8b949e', fs: 14, inner: true },
  prefill: { x: 720, y: 575, w: 240, h: 90, label: 'vLLM Prefill', sublabel: 'Pod B (A100)', color: '#d2a8ff', fs: 15, inner: true },

  // Row 3 inside InferencePool: KV Cache Store - y=695
  kvcache: { x: 220, y: 695, w: 240, h: 60, label: 'KV Cache Store', sublabel: 'Shared PVC', color: '#8b949e', fs: 13, inner: true },

  // Row 3 inside InferencePool: Unified replicas - aligned at y=695
  unified: { x: 520, y: 695, w: 200, h: 80, label: 'Unified vLLM', sublabel: 'Pod 1 (TP=8)', color: '#58a6ff', fs: 14, inner: true },
  unified2: { x: 760, y: 695, w: 200, h: 80, label: 'Unified vLLM', sublabel: 'Pod 2 (TP=8)', color: '#58a6ff', fs: 14, inner: true },

  // Row 3 inside InferencePool: Leader - aligned at y=695
  leader: { x: 440, y: 695, w: 200, h: 60, label: 'Leader', sublabel: 'Ray Head', color: '#d2a8ff', fs: 14, inner: true },

  // Row 4 inside InferencePool: Workers - aligned at y=770
  worker1: { x: 220, y: 770, w: 160, h: 50, label: 'Worker 1', sublabel: 'Shard 1/8', color: '#79c0ff', fs: 12, inner: true },
  worker2: { x: 400, y: 770, w: 160, h: 50, label: 'Worker 2', sublabel: 'Shard 2/8', color: '#79c0ff', fs: 12, inner: true },
  worker3: { x: 580, y: 770, w: 160, h: 50, label: 'Worker 3', sublabel: 'Shard 3/8', color: '#79c0ff', fs: 12, inner: true },
  worker_etc: { x: 760, y: 770, w: 160, h: 50, label: '...', sublabel: 'Shards 4-8', color: '#79c0ff55', fs: 12, inner: true },
};

const tips = {
  gateway: {t:'Gateway API (Istio/Envoy)', d:'L7 proxy that accepts user requests. Consults EPP via ext_proc protocol to determine optimal destination.', dt:[['Type','Gateway API'],['Implementation','Istio + Envoy'],['Protocol','HTTP/1.1, HTTP/2, gRPC'],['Port','80/443']]},
  epp: {t:'Endpoint Picker (EPP)', d:'Routing engine that scores and selects model server pods based on real-time metrics, KV-cache affinity, and configured policies.', dt:[['Type','ext_proc filter'],['Scores Based On','Queue depth, KV-cache hits, latency'],['Output','Selected pod IP'],['Mode','Disaggregated or unified']]},
  routing_policy: {t:'Routing Policy', d:'Configures routing behavior including KV-cache awareness, prefix cache heuristics, and load balancing strategies.', dt:[['KV-Cache Aware','Routes follow-up requests to same pod'],['Prefix Cache','Maximizes cache hit rate'],['Policies','Round-robin, least-loaded, cache-affinity']]},
  autoscaler: {t:'Workload Variant Autoscaler', d:'Globally optimized scaling that minimizes cost by routing traffic across different model variants while meeting latency targets.', dt:[['Type','SLO-aware autoscaler'],['Metrics','Queue depth, latency, cost'],['Variants','Different hardware, quantization'],['Version','v0.6.0']]},
  sidecar: {t:'Sidecar', d:'Coordinates disaggregated serving transaction. Orchestrates KV cache transfer between prefill and decode workers.', dt:[['Role','Transaction coordinator'],['Coordinates','Prefill ↔ Decode'],['Triggers','KVXfer metadata exchange']]},
  prefill: {t:'vLLM Prefill Pod', d:'Compute-intensive pod that processes input prompt in parallel, generates first token and KV cache. Uses high-FLOPS GPUs.', dt:[['Phase','Prompt Processing'],['Output','First token + KV cache'],['GPU Type','A100 (high compute)'],['Pod','Pod B']]},
  decode: {t:'vLLM Decode Pod', d:'Memory-intensive pod that loads KV cache and generates output tokens autoregressively. Uses cheaper GPUs with high memory bandwidth.', dt:[['Phase','Token Generation'],['Input','KV cache from prefill'],['GPU Type','L4/T4 (memory bandwidth)'],['Pod','Pod A']]},
  nixl: {t:'NIXL', d:'NVIDIA Inference Xfer Library. High-speed KV cache transfer between prefill and decode pods over GPU-direct RDMA.', dt:[['Full Name','NVIDIA Inference Xfer Library'],['Transport','GPU-direct RDMA, DCN'],['Direction','Decode pulls from Prefill']]},
  kvcache: {t:'KV Cache Store', d:'Shared storage for KV cache transfer between prefill and decode pods. Enables cache reuse for follow-up requests.', dt:[['Type','Shared PVC or S3'],['Format','vLLM KV cache tensors'],['Access','Prefill writes, Decode reads']]},
  unified: {t:'Unified vLLM Pod 1', d:'Single pod that handles both prefill and decode. Uses tensor parallelism across 8 GPUs. Simpler but less cost-optimized than disaggregated.', dt:[['Mode','Prefill + Decode'],['Tensor Parallelism','8-way (8 GPUs)'],['GPU Type','A100 or H100'],['Replica','Pod 1']]},
  unified2: {t:'Unified vLLM Pod 2', d:'Replica pod for load balancing. EPP selects between available pods based on queue depth and latency metrics.', dt:[['Mode','Prefill + Decode'],['Tensor Parallelism','8-way (8 GPUs)'],['GPU Type','A100 or H100'],['Replica','Pod 2']]},
  leader: {t:'Leader Pod', d:'Coordinator in LeaderWorkerSet. Runs Ray head, coordinates distributed inference across 8 worker pods with tensor parallelism.', dt:[['Role','Coordinator'],['Ray','Ray head (port 6379)'],['vLLM','Receives requests, aggregates'],['Workers','8 workers (TP=8)']]},
  worker1: {t:'Worker Pod 1', d:'Worker in LeaderWorkerSet. Computes model shard 1/8. Connects to leader via LWS_LEADER_ADDRESS.', dt:[['Role','Compute worker'],['Ray','Ray worker'],['Model Shard','1/8'],['GPU','8 GPUs per pod']]},
  worker2: {t:'Worker Pod 2', d:'Worker in LeaderWorkerSet. Computes model shard 2/8. Connects to leader via LWS_LEADER_ADDRESS.', dt:[['Role','Compute worker'],['Ray','Ray worker'],['Model Shard','2/8'],['GPU','8 GPUs per pod']]},
  worker3: {t:'Worker Pod 3', d:'Worker in LeaderWorkerSet. Computes model shard 3/8. Connects to leader via LWS_LEADER_ADDRESS.', dt:[['Role','Compute worker'],['Ray','Ray worker'],['Model Shard','3/8'],['GPU','8 GPUs per pod']]},
};

function showOverlay(key) {
  const tip = tips[key], n = N[key];
  if (!tip) return;
  overlayWasRunning = running;
  highlightKey = key;
  if (running && !paused) { paused = true; running = false; if (stepTimer) clearTimeout(stepTimer); updatePlayBtn(); }
  const ov = document.getElementById('overlay');
  const card = document.getElementById('overlay-card');
  document.getElementById('overlay-accent').style.background = n.color || '#58a6ff';
  document.getElementById('overlay-title').textContent = tip.t;
  document.getElementById('overlay-title').style.color = n.color || '#c9d1d9';
  document.getElementById('overlay-sub').textContent = tip.d;
  let dh = '';
  if (tip.dt) tip.dt.forEach(([l,v]) => { dh += `<div class="modal-detail"><strong>${esc(l)}:</strong> ${esc(v)}</div>`; });
  document.getElementById('overlay-details').innerHTML = dh;
  const nx = tx(n.x), ny = ty(n.y), nw = ts(n.w), nh = ts(n.h);
  const canvasRight = innerWidth - 380;
  let cx, cy;
  if (nx + nw + 440 < canvasRight) { cx = nx + nw + 20; } else if (nx - 440 > 0) { cx = nx - 440; } else { cx = Math.max(10, (canvasRight - 420) / 2); }
  cy = Math.max(10, Math.min(ny - 40, innerHeight - 500));
  card.style.left = cx + 'px';
  card.style.top = cy + 'px';
  ov.style.display = 'block';
  const hb = document.getElementById('highlight-box');
  hb.style.left = nx + 'px';
  hb.style.top = ny + 'px';
  hb.style.width = nw + 'px';
  hb.style.height = nh + 'px';
  hb.style.border = `3px solid ${n.color || '#58a6ff'}`;
  hb.style.boxShadow = `0 0 30px ${n.color || '#58a6ff'}88, inset 0 0 20px ${n.color || '#58a6ff'}22`;
  hb.style.background = isDark ? '#161b22' : '#f6f8fa';
  hb.style.display = 'flex'; hb.style.flexDirection = 'column'; hb.style.alignItems = 'center'; hb.style.justifyContent = 'center';
  hb.style.fontFamily = 'system-ui'; hb.style.color = isDark ? '#c9d1d9' : '#24292f';
  hb.innerHTML = `<div style="font-weight:700;font-size:${nw > 150 ? 16 : 13}px">${esc(n.label)}</div>${n.sublabel ? `<div style="font-size:${nw > 150 ? 12 : 10}px;color:#8b949e">${esc(n.sublabel)}</div>` : ''}`;
  draw();
}

function closeOverlay() {
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('highlight-box').style.display = 'none';
  highlightKey = null;
  draw();
  if (overlayWasRunning) { paused = false; running = true; updatePlayBtn(); if (!animFrame) animate(); stepTimer = setTimeout(execStep, 300 / playbackSpeed); }
}

function C() {
  return isDark
    ? { bg:'#0d1117', box:'#161b22', boxA:'#1a2332', bdr:'#30363d', txt:'#c9d1d9', dim:'#8b949e' }
    : { bg:'#fff', box:'#f6f8fa', boxA:'#ddf4ff', bdr:'#d0d7de', txt:'#24292f', dim:'#656d76' };
}

function resize() {
  const panelW = 380;
  W = canvas.width = innerWidth - panelW;
  H = canvas.height = innerHeight;
  sc = Math.min(W / LW, H / LH) * 0.95;
  ox = (W - LW * sc) / 2;
  oy = (H - LH * sc) * 0.05;
  draw();
}
addEventListener('resize', resize);

function tx(x) { return ox + x * sc; }
function ty(y) { return oy + y * sc; }
function ts(s) { return s * sc; }

function drawBox(key) {
  const n = N[key], c = C();
  if (!n || n.type === 'boundary' || n.type === 'container' || n.type === 'label') return;

  // Hide components based on active flow
  if (activeFlow === 'disaggregated') {
    if (['unified', 'unified2', 'leader', 'worker1', 'worker2', 'worker3', 'worker_etc'].includes(key)) return;
  } else if (activeFlow === 'unified') {
    if (['sidecar', 'decode', 'nixl', 'prefill', 'kvcache', 'leader', 'worker1', 'worker2', 'worker3', 'worker_etc'].includes(key)) return;
  } else if (activeFlow === 'multinode') {
    if (['sidecar', 'decode', 'nixl', 'prefill', 'kvcache', 'unified', 'unified2'].includes(key)) return;
  }

  const x = tx(n.x), y = ty(n.y), w = ts(n.w), h = ts(n.h);
  const isA = activeNodes.has(key), hasBadge = badges[key] != null;
  ctx.save();

  if (n.type === 'icon') {
    ctx.font = `${ts(32)}px serif`;
    ctx.textAlign = 'center';
    ctx.fillText('\u{1F464}', x + w / 2, y + ts(26));
    ctx.font = `bold ${ts(16)}px system-ui`;
    ctx.fillStyle = c.txt;
    ctx.fillText(n.label, x + w / 2, y + ts(46));
    ctx.restore();
    return;
  }

  let fadeA = 1;
  if (fading[key]) {
    const el = Date.now() - fading[key];
    fadeA = Math.min(el / 500, 1);
    if (el > 500) delete fading[key];
  }

  if (isA || hasBadge) {
    ctx.shadowColor = n.color;
    ctx.shadowBlur = ts(18) * fadeA;
    ctx.globalAlpha = 0.3 + 0.7 * fadeA;
  }

  ctx.beginPath();
  ctx.roundRect(x, y, w, h, ts(8));
  ctx.fillStyle = (isA || hasBadge) ? c.boxA : c.box;
  ctx.fill();
  ctx.strokeStyle = (isA || hasBadge) ? n.color : c.bdr;
  ctx.lineWidth = ts((isA || hasBadge) ? 2.5 : 1.5);
  if (n.inner) { ctx.setLineDash([ts(5), ts(4)]); }
  ctx.stroke();
  ctx.setLineDash([]);

  const fs = n.fs || 16;

function edgePt(n, targetX, targetY, offset) {
  offset = offset || 0;
  const cx_ = n.x + n.w / 2, cy_ = n.y + n.h / 2;
  const dx = targetX - cx_, dy = targetY - cy_;
  if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return { x: cx_, y: cy_ };
  const hw = n.w / 2, hh = n.h / 2;
  let ex, ey;
  if (Math.abs(dx) * hh > Math.abs(dy) * hw) {
    // Vertical edge (left or right)
    ex = cx_ + (dx > 0 ? hw : -hw);
    ey = cy_ + dy * (hw / Math.abs(dx));
    // Apply offset perpendicular to edge (vertical offset)
    ey += offset;
  } else {
    // Horizontal edge (top or bottom)
    ey = cy_ + (dy > 0 ? hh : -hh);
    ex = cx_ + dx * (hh / Math.abs(dy));
    // Apply offset perpendicular to edge (horizontal offset)
    ex += offset;
  }
  return { x: ex, y: ey };
}

function drawArrowLine(points, color, num, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha || 1;
  // Draw path
  ctx.beginPath();
  ctx.moveTo(tx(points[0].x), ty(points[0].y));
  for (let i = 1; i < points.length; i++) {
    ctx.lineTo(tx(points[i].x), ty(points[i].y));
  }
  ctx.strokeStyle = color;
  ctx.lineWidth = ts(2.5);
  ctx.stroke();
  // Draw arrowhead at end
  const last = points[points.length - 1];
  const prev = points[points.length - 2];
  const ang = Math.atan2(last.y - prev.y, last.x - prev.x), sz = ts(10);
  ctx.beginPath();
  ctx.moveTo(tx(last.x), ty(last.y));
  ctx.lineTo(tx(last.x) - sz * Math.cos(ang - 0.4), ty(last.y) - sz * Math.sin(ang - 0.4));
  ctx.lineTo(tx(last.x) - sz * Math.cos(ang + 0.4), ty(last.y) - sz * Math.sin(ang + 0.4));
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
  // Draw number badge - calculate better position
  if (num != null) {
    // Find point 40% along the path for better badge placement
    let totalLen = 0;
    const segLens = [];
    for (let i = 1; i < points.length; i++) {
      const dx = points[i].x - points[i - 1].x;
      const dy = points[i].y - points[i - 1].y;
      const len = Math.sqrt(dx * dx + dy * dy);
      segLens.push(len);
      totalLen += len;
    }
    const targetDist = totalLen * 0.4;
    let accum = 0;
    let badgePos = points[0];
    for (let i = 0; i < segLens.length; i++) {
      if (accum + segLens[i] >= targetDist) {
        const segT = (targetDist - accum) / segLens[i];
        badgePos = {
          x: points[i].x + (points[i + 1].x - points[i].x) * segT,
          y: points[i].y + (points[i + 1].y - points[i].y) * segT
        };
        break;
      }
      accum += segLens[i];
    }
    const r = ts(13);
    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(tx(badgePos.x), ty(badgePos.y), r, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.font = `bold ${ts(11)}px system-ui`;
    ctx.fillStyle = isDark ? '#0d1117' : '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(num), tx(badgePos.x), ty(badgePos.y));
  }
  ctx.restore();
}

function drawLines() {
  lines.forEach(l => {
    const fn = N[l.from], tn = N[l.to];
    if (!fn || !tn) return;
    let points = [];
    if (l.waypoints) {
      // Use waypoints
      const fp = edgePt(fn, l.waypoints[0].x, l.waypoints[0].y, l.fromOffset);
      const tp = edgePt(tn, l.waypoints[l.waypoints.length - 1].x, l.waypoints[l.waypoints.length - 1].y, l.toOffset);
      points = [fp, ...l.waypoints, tp];
    } else {
      // Direct line
      const fp = edgePt(fn, tn.x + tn.w / 2, tn.y + tn.h / 2, l.fromOffset);
      const tp = edgePt(tn, fn.x + fn.w / 2, fn.y + fn.h / 2, l.toOffset);
      points = [fp, tp];
    }
    drawArrowLine(points, l.color, l.num, 0.8);
  });
}

class Dot {
  constructor(fKey, tKey, color, speed, cb, opts) {
    this.color = color;
    this.t = 0;
    this.cb = cb;
    this.alive = true;
    const fn = N[fKey], tn = N[tKey];
    opts = opts || {};

    // Build path with waypoints
    if (opts.waypoints) {
      const fp = edgePt(fn, opts.waypoints[0].x, opts.waypoints[0].y, opts.fromOffset);
      const tp = edgePt(tn, opts.waypoints[opts.waypoints.length - 1].x, opts.waypoints[opts.waypoints.length - 1].y, opts.toOffset);
      this.pts = [fp, ...opts.waypoints, tp];
    } else {
      const fp = edgePt(fn, tn.x + tn.w / 2, tn.y + tn.h / 2, opts.fromOffset);
      const tp = edgePt(tn, fn.x + fn.w / 2, fn.y + fn.h / 2, opts.toOffset);
      this.pts = [fp, tp];
    }

    // Calculate segment lengths
    this.segLens = [];
    this.totalLen = 0;
    for (let i = 1; i < this.pts.length; i++) {
      const dx = this.pts[i].x - this.pts[i - 1].x;
      const dy = this.pts[i].y - this.pts[i - 1].y;
      const len = Math.sqrt(dx * dx + dy * dy);
      this.segLens.push(len);
      this.totalLen += len;
    }

    // Normalize speed for consistent pixel velocity
    const pxPerFrame = 4;
    this.speed = this.totalLen > 0 ? (pxPerFrame / this.totalLen) * (speed / 0.02) : speed;
  }
  update() {
    this.t += this.speed;
    if (this.t >= 1) { this.t = 1; this.alive = false; if (this.cb) this.cb(); }
  }
  posAt(t) {
    const dist = Math.max(0, Math.min(1, t)) * this.totalLen;
    let accum = 0;
    for (let i = 0; i < this.segLens.length; i++) {
      if (accum + this.segLens[i] >= dist) {
        const segT = (dist - accum) / this.segLens[i];
        return {
          x: this.pts[i].x + (this.pts[i + 1].x - this.pts[i].x) * segT,
          y: this.pts[i].y + (this.pts[i + 1].y - this.pts[i].y) * segT,
          seg: i
        };
      }
      accum += this.segLens[i];
    }
    return { x: this.pts[this.pts.length - 1].x, y: this.pts[this.pts.length - 1].y, seg: this.segLens.length - 1 };
  }
  draw() {
    const pos = this.posAt(this.t);
    ctx.save();
    // Draw trail
    ctx.beginPath();
    ctx.moveTo(tx(this.pts[0].x), ty(this.pts[0].y));
    for (let i = 0; i < pos.seg; i++) {
      ctx.lineTo(tx(this.pts[i + 1].x), ty(this.pts[i + 1].y));
    }
    ctx.lineTo(tx(pos.x), ty(pos.y));
    ctx.strokeStyle = this.color;
    ctx.lineWidth = ts(2);
    ctx.globalAlpha = 0.3;
    ctx.stroke();
    // Draw packet
    ctx.globalAlpha = 1;
    const si = Math.min(pos.seg, this.pts.length - 2);
    const ang = Math.atan2(this.pts[si + 1].y - this.pts[si].y, this.pts[si + 1].x - this.pts[si].x);
    ctx.save();
    ctx.translate(tx(pos.x), ty(pos.y));
    ctx.rotate(ang);
    const pw = ts(13), ph = ts(7);
    ctx.beginPath();
    ctx.moveTo(pw / 2, 0);
    ctx.lineTo(pw / 6, -ph / 2);
    ctx.lineTo(-pw / 2, -ph / 2);
    ctx.lineTo(-pw / 2, ph / 2);
    ctx.lineTo(pw / 6, ph / 2);
    ctx.closePath();
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = ts(16);
    ctx.fill();
    ctx.restore();
    ctx.restore();
  }
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBounds();
  drawLines();
  Object.keys(N).forEach(k => drawBox(k));
  dots.forEach(d => { d.update(); d.draw(); });
  dots = dots.filter(d => d.alive);
  if (highlightKey && N[highlightKey]) {
    const n = N[highlightKey];
    const pad = 8;
    ctx.save();
    ctx.shadowColor = n.color || '#58a6ff';
    ctx.shadowBlur = ts(30);
    ctx.strokeStyle = n.color || '#58a6ff';
    ctx.lineWidth = ts(3);
    ctx.beginPath();
    ctx.roundRect(tx(n.x) - pad, ty(n.y) - pad, ts(n.w) + pad * 2, ts(n.h) + pad * 2, ts(10));
    ctx.stroke();
    ctx.restore();
  }
}

const flowMultinode = [
  { t: '1. Client → Gateway', mode: 'arrow', f: 'user', to: 'gateway', c: '#58a6ff', num: 1 },
  { t: '2. Gateway → EPP (ext_proc)', mode: 'arrow', f: 'gateway', to: 'epp', c: '#58a6ff', num: 2, glow: 'router_box', fromOffset: -25, toOffset: -25 },
  { t: 'EPP selects Leader pod', mode: 'lightup', target: 'epp' },
  { t: '3. EPP → Gateway (selected pod)', mode: 'arrow', f: 'epp', to: 'gateway', c: '#58a6ff', num: 3, fromOffset: 25, toOffset: 25 },
  { t: '4. Gateway → Leader Pod', mode: 'arrow', f: 'gateway', to: 'leader', c: '#58a6ff', num: 4, glow: 'inferencepool_box', fromOffset: -30, toOffset: -30 },
  { t: 'Leader broadcasts to workers', mode: 'lightup', target: 'leader' },
  { t: '5. Leader → Worker 1', mode: 'arrow', f: 'leader', to: 'worker1', c: '#d2a8ff', num: 5, fromOffset: -60, toOffset: -30 },
  { t: '6. Leader → Worker 2', mode: 'arrow', f: 'leader', to: 'worker2', c: '#d2a8ff', num: 6, fromOffset: -20, toOffset: -20 },
  { t: '7. Leader → Worker 3', mode: 'arrow', f: 'leader', to: 'worker3', c: '#d2a8ff', num: 7, fromOffset: 20, toOffset: -20 },
  { t: 'Workers compute shards', mode: 'lightup', target: 'worker1' },
  { t: 'Workers compute shards', mode: 'lightup', target: 'worker2' },
  { t: 'Workers compute shards', mode: 'lightup', target: 'worker3' },
  { t: '8. Worker 1 → Leader', mode: 'arrow', f: 'worker1', to: 'leader', c: '#79c0ff', num: 8, fromOffset: 30, toOffset: -50 },
  { t: '9. Worker 2 → Leader', mode: 'arrow', f: 'worker2', to: 'leader', c: '#79c0ff', num: 9, fromOffset: 20, toOffset: -10 },
  { t: '10. Worker 3 → Leader', mode: 'arrow', f: 'worker3', to: 'leader', c: '#79c0ff', num: 10, fromOffset: -20, toOffset: 10 },
  { t: 'Leader aggregates results', mode: 'lightup', target: 'leader' },
  { t: '11. Leader → Gateway (response)', mode: 'arrow', f: 'leader', to: 'gateway', c: '#3fb950', num: 11, fromOffset: 0, toOffset: 50 },
  { t: '12. Gateway → Client', mode: 'arrow', f: 'gateway', to: 'user', c: '#3fb950', num: 12 },
];

const flowMap = { disaggregated: flowDisaggregated, unified: flowUnified, multinode: flowMultinode };
let flow = flowDisaggregated;

function updatePlayBtn() {
  const btn = document.querySelector('.start');
  if (paused) btn.innerHTML = '▶ Resume';
  else if (running) btn.innerHTML = '▮▮ Pause';
  else btn.innerHTML = '▶ Start';
}

function cycleSpeed() {
  const speeds = [0.5, 1, 2];
  const idx = speeds.indexOf(playbackSpeed);
  playbackSpeed = speeds[(idx + 1) % speeds.length];
  document.getElementById('speed-btn').textContent = playbackSpeed + 'x';
}

function stepLine(s) {
  const line = { from: s.f, to: s.to, color: s.c, num: s.num };
  if (s.waypoints) line.waypoints = s.waypoints;
  if (s.fromOffset !== undefined) line.fromOffset = s.fromOffset;
  if (s.toOffset !== undefined) line.toOffset = s.toOffset;
  return line;
}

let stepOnceMode = false;
function stepOnce() {
  if (running && !paused) { paused = true; running = false; if (stepTimer) clearTimeout(stepTimer); updatePlayBtn(); return; }
  if (runStepIndex === 0) initInspector();
  if (runStepIndex >= flow.length) { doReset(); return; }
  stepOnceMode = true; running = true; paused = false;
  if (!animFrame) animate();
  execStep();
}

function run() {
  if (paused) { paused = false; running = true; updatePlayBtn(); if (!animFrame) animate(); stepTimer = setTimeout(execStep, 300 / playbackSpeed); return; }
  if (running) { paused = true; running = false; if (stepTimer) clearTimeout(stepTimer); updatePlayBtn(); return; }
  doReset(); running = true; paused = false; runStepIndex = 0; initInspector(); updatePlayBtn(); stepTimer = setTimeout(execStep, 300); if (!animFrame) animate();
}

function execStep() {
  if (!running || paused || runStepIndex >= flow.length) { if (runStepIndex >= flow.length) { running = false; paused = false; updatePlayBtn(); } return; }
  const si = runStepIndex, s = flow[si];
  for (let j = 0; j < si; j++) { const prev = document.getElementById('step-' + j); if (prev) prev.className = 'step done'; }
  const el = document.getElementById('step-' + si);
  el.className = 'step active';
  el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  inspStep(si + 1);

  if (s.mode === 'arrow') {
    if (s.f) activeNodes.add(s.f);
    const dotOpts = {};
    if (s.waypoints) dotOpts.waypoints = s.waypoints;
    if (s.fromOffset !== undefined) dotOpts.fromOffset = s.fromOffset;
    if (s.toOffset !== undefined) dotOpts.toOffset = s.toOffset;
    dots.push(new Dot(s.f, s.to, s.c, 0.02 * playbackSpeed, () => {
      lines.push(stepLine(s));
      if (s.glow) glowing.add(s.glow);
      activeNodes.add(s.to); el.className = 'step done'; saveSnapshot(si); runStepIndex++;
      if (stepOnceMode) { stepOnceMode = false; paused = true; running = false; updatePlayBtn(); }
      else if (running && !paused) stepTimer = setTimeout(execStep, 300 / playbackSpeed);
    }, dotOpts));
  } else if (s.mode === 'lightup') {
    fading[s.target] = Date.now(); activeNodes.add(s.target);
    el.className = 'step done'; saveSnapshot(si); runStepIndex++;
    if (stepOnceMode) { stepOnceMode = false; paused = true; running = false; updatePlayBtn(); }
    else if (running && !paused) stepTimer = setTimeout(execStep, 800 / playbackSpeed);
  }
}

function saveSnapshot(stepIdx) { snapshots[stepIdx] = { activeNodes: new Set(activeNodes), badges: JSON.parse(JSON.stringify(badges)), lines: JSON.parse(JSON.stringify(lines)), glowing: new Set(glowing) }; }
function restoreSnapshot(stepIdx) {
  if (stepIdx < 0) { activeNodes.clear(); badges = {}; lines = []; glowing.clear(); return; }
  const snap = snapshots[stepIdx]; if (!snap) return;
  activeNodes = new Set(snap.activeNodes); badges = JSON.parse(JSON.stringify(snap.badges)); lines = JSON.parse(JSON.stringify(snap.lines)); glowing = new Set(snap.glowing);
}

function jumpToStep(targetStep) {
  if (running) { running = false; if (stepTimer) clearTimeout(stepTimer); }
  restoreSnapshot(targetStep); runStepIndex = targetStep + 1;
  document.querySelectorAll('.step').forEach((el, i) => { if (i <= targetStep) el.className = 'step done'; else el.className = 'step pending'; });
  const clickedEl = document.getElementById('step-' + targetStep); if (clickedEl) clickedEl.className = 'step active';
  initInspector(); for (let i = 1; i <= targetStep + 1; i++) inspStep(i);
  dots = []; fading = {}; paused = true; updatePlayBtn();
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  requestAnimationFrame(() => { draw(); draw(); });
}

function doReset() {
  running = false; paused = false; runStepIndex = 0; if (stepTimer) clearTimeout(stepTimer);
  dots = []; activeNodes.clear(); badges = {}; lines = []; fading = {}; snapshots = []; glowing.clear();
  initSteps(); updatePlayBtn();
  document.getElementById('insp-content').innerHTML = '<div style="color:#8b949e;font-family:-apple-system,sans-serif;font-size:13px">Press Start to see the flow</div>';
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  draw();
}

document.getElementById('flow-select').addEventListener('change', function() {
  activeFlow = this.value;
  flow = flowMap[activeFlow];
  doReset();
});

resize();
initSteps();
draw();
</script>
</body>
</html>
