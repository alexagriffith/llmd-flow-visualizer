<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>llm-d Request Flow Visualizer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9;overflow:hidden;transition:background .3s,color .3s}
body.light{background:#fff;color:#24292f}

.right-panel{position:fixed;top:0;right:0;width:380px;height:100vh;z-index:100;display:flex;flex-direction:column;background:#161b22;border-left:1px solid #30363d;overflow:hidden;transition:background .3s,border-color .3s}
body.light .right-panel{background:#f6f8fa;border-color:#d0d7de}

.flow-bar{padding:12px 16px;border-bottom:1px solid #30363d;flex-shrink:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
body.light .flow-bar{border-color:#d0d7de}
.flow-bar select{flex:1;padding:7px 10px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;font-size:13px;font-family:inherit;cursor:pointer}
body.light .flow-bar select{background:#fff;color:#24292f;border-color:#d0d7de}
.flow-bar button{padding:7px 14px;border:1px solid #30363d;border-radius:6px;background:#161b22;color:#c9d1d9;cursor:pointer;font-size:13px;font-family:inherit;transition:all .15s}
body.light .flow-bar button{background:#f6f8fa;color:#24292f;border-color:#d0d7de}
.flow-bar button:hover{border-color:#a78bfa}
.flow-bar .start{border-color:#a78bfa;color:#a78bfa;min-width:90px}
.flow-bar .rst{border-color:#f0883e;color:#f0883e}

.steps-section{padding:10px 16px;border-bottom:1px solid #30363d;flex:2;overflow-y:auto}
body.light .steps-section{border-color:#d0d7de}
.steps-title{font-weight:700;margin-bottom:6px;font-size:14px}
.step{margin:2px 0;color:#484f58;display:flex;align-items:flex-start;gap:6px;font-size:12px;line-height:1.4;cursor:pointer;padding:3px 4px;border-radius:4px;transition:all .2s}
body.light .step{color:#b0b8c1}
.step:hover{background:#a78bfa22;cursor:pointer;color:#a78bfa;transform:translateX(4px);border-left:2px solid #a78bfa;padding-left:6px}
body.light .step:hover{background:#e5dbff88;cursor:pointer;color:#8250df;transform:translateX(4px);border-left:2px solid #8250df;padding-left:6px}
.step-mk{flex-shrink:0;width:16px;text-align:center;font-size:13px}
.step.pending{color:#484f58}
body.light .step.pending{color:#b0b8c1}
.step.pending .step-mk::before{content:'\25CB'}
.step.active{color:#a78bfa}
.step.active .step-mk::before{content:'\25CF'}
.step.done{color:#3fb950}
.step.done .step-mk::before{content:'\2713'}

.insp-section{flex:3;overflow-y:auto;padding:10px 16px;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:11px}
.insp-title{font-weight:700;font-size:14px;margin-bottom:6px;font-family:-apple-system,sans-serif}
.insp-sec{margin:6px 0 2px;font-weight:600;color:#a78bfa;font-size:12px;font-family:-apple-system,sans-serif}
.insp-line{margin:1px 0;padding:2px 6px;border-radius:3px;white-space:pre;line-height:1.6}

.theme-toggle{position:fixed;top:16px;right:396px;z-index:200;width:36px;height:36px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#c9d1d9;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s}
body.light .theme-toggle{background:#f6f8fa;color:#24292f;border-color:#d0d7de}

.viz-title{position:fixed;top:14px;left:0;right:380px;z-index:200;text-align:center;font-size:22px;font-weight:700;background:linear-gradient(135deg,#a78bfa,#06b6d4,#f0883e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.5px;pointer-events:none}

.legend{position:fixed;bottom:16px;left:16px;z-index:100;padding:10px 14px;background:#161b22;border:1px solid #30363d;border-radius:10px;font-size:13px;transition:all .3s}
body.light .legend{background:#f6f8fa;border-color:#d0d7de}
.legend-title{font-weight:600;margin-bottom:5px;font-size:14px}
.legend-item{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}
.legend-dot{width:11px;height:11px;border-radius:50%}

#overlay{display:none;position:fixed;top:0;left:0;right:380px;bottom:0;z-index:300;background:rgba(0,0,0,0.7)}
#overlay-card{position:absolute;width:420px;background:#161b22;border:2px solid #30363d;border-radius:12px;padding:20px;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
body.light #overlay-card{background:#f6f8fa;border-color:#d0d7de}
#overlay-accent{height:4px;margin:-20px -20px 12px;border-radius:10px 10px 0 0}
#overlay-title{font-size:18px;font-weight:700;margin-bottom:8px}
#overlay-desc{font-size:14px;color:#8b949e;margin-bottom:16px;line-height:1.5}
#overlay-details{font-size:13px}
#overlay-close{position:absolute;top:16px;right:16px;width:24px;height:24px;border:none;background:transparent;color:#8b949e;font-size:20px;cursor:pointer;line-height:1}
#overlay-resume{margin-top:16px;padding:8px 16px;background:#3fb950;color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:inherit;font-size:13px}
#overlay-resume:hover{background:#2da44e}
#highlight-box{display:none;position:absolute;pointer-events:none;z-index:250;border-radius:8px}

.steps-section::-webkit-scrollbar,.insp-section::-webkit-scrollbar{width:6px}
.steps-section::-webkit-scrollbar-track,.insp-section::-webkit-scrollbar-track{background:transparent}
.steps-section::-webkit-scrollbar-thumb,.insp-section::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
body.light .steps-section::-webkit-scrollbar-thumb,body.light .insp-section::-webkit-scrollbar-thumb{background:#d0d7de}
</style>
</head>
<body>
<div class="theme-toggle" id="thm" onclick="toggleTheme()">☾</div>
<div class="viz-title">llm-d Request Flow Visualizer</div>

<canvas id="canvas"></canvas>

<div class="right-panel">
  <div class="flow-bar">
    <select id="flowSel" onchange="changeFlow()">
      <option value="cache-hit">Cache Hit Flow (Fast Path)</option>
      <option value="cache-miss">Cache Miss Flow (Cold Start)</option>
      <option value="disaggregated">Disaggregated Serving (P/D Split)</option>
    </select>
    <button class="start" id="playBtn" onclick="togglePlay()">▶ Play</button>
    <button class="rst" onclick="reset()">Reset</button>
    <select id="speedSel" style="width:70px" onchange="changeSpeed()">
      <option value="2">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="0.5">2x</option>
    </select>
  </div>

  <div class="steps-section">
    <div class="steps-title">Flow Steps <span style="color:#8b949e;font-weight:400;font-size:12px">· click to jump</span></div>
    <div id="stepsList"></div>
  </div>

  <div class="insp-section">
    <div class="insp-title">Request / Response</div>
    <div id="inspector"></div>
  </div>
</div>

<div class="legend">
  <div class="legend-title">Legend</div>
  <div class="legend-item"><div class="legend-dot" style="background:#58a6ff"></div>Gateway</div>
  <div class="legend-item"><div class="legend-dot" style="background:#d2a8ff"></div>Inference Pods</div>
  <div class="legend-item"><div class="legend-dot" style="background:#79c0ff"></div>EPP / Routing</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f0883e"></div>Storage / Cache</div>
  <div class="legend-item"><div class="legend-dot" style="background:#8b949e"></div>Transfer</div>
  <div class="legend-item"><div class="legend-dot" style="background:#3fb950"></div>Response</div>
</div>

<div id="overlay" onclick="if(event.target===this)closeOverlay()">
  <div id="overlay-card">
    <div id="overlay-accent"></div>
    <button id="overlay-close" onclick="closeOverlay()">×</button>
    <div id="overlay-title"></div>
    <div id="overlay-desc"></div>
    <div id="overlay-details"></div>
    <button id="overlay-resume" onclick="closeOverlay()" style="display:none">▶ Resume Flow</button>
  </div>
</div>
<div id="highlight-box"></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, sc = 1, ox = 0, oy = 30;
const LW = 1400, LH = 1000;

let isDark = true;
let currentFlow = 'cache-hit';
let stepIdx = 0;
let running = false, paused = false;
let playbackSpeed = 1;
let stepTimer = null;
let highlightKey = null;

// Transform helpers
const tx = x => x * sc + ox;
const ty = y => y * sc + oy;
const ts = s => s * sc;

// Node definitions - grid-based layout with proper alignment
// Grid: 280px left margin, components use 280px width + 40px gap
const N = {
  // External - left side
  user: { x: 60, y: 150, w: 160, h: 70, label: 'Client / User', type: 'external', color: '#58a6ff' },

  // Cluster boundary
  cluster: { x: 280, y: 60, w: 1050, h: 860, type: 'boundary', label: 'kubernetes cluster' },

  // Top tier - Gateway (full width)
  gateway: { x: 320, y: 100, w: 960, h: 100, label: 'Gateway API', sublabel: '(Istio/Envoy)', color: '#58a6ff', fs: 26 },

  // Second tier - ext-proc and routing layer
  extproc: { x: 320, y: 240, w: 450, h: 90, label: 'Envoy ext-proc', sublabel: '(gRPC hook)', color: '#d2a8ff', fs: 22 },
  epp: { x: 810, y: 240, w: 220, h: 90, label: 'EPP', sublabel: '(Endpoint Picker)', color: '#79c0ff', fs: 24 },
  kvindex: { x: 1070, y: 240, w: 210, h: 90, label: 'KV Cache Index', sublabel: '(Block tracker)', color: '#f0883e', fs: 20 },

  // InferencePool boundary
  poolBoundary: { x: 300, y: 380, w: 990, h: 200, type: 'boundary', label: 'InferencePool' },

  // Third tier - vLLM Pods (equal spacing within pool)
  vllmPodA: { x: 330, y: 430, w: 280, h: 110, label: 'vLLM Pod A', sublabel: 'Cache hit: 85%', color: '#d2a8ff', fs: 20 },
  vllmPodB: { x: 650, y: 430, w: 280, h: 110, label: 'vLLM Pod B', sublabel: 'Least loaded', color: '#d2a8ff', fs: 20 },
  vllmPodC: { x: 970, y: 430, w: 280, h: 110, label: 'vLLM Pod C', sublabel: 'Low cache hit', color: '#d2a8ff', fs: 20 },

  // Fourth tier - KV Cache Store (aligned with right pods)
  kvstore: { x: 970, y: 620, w: 280, h: 90, label: 'KV Cache Store', sublabel: '(Persistent)', color: '#f0883e', fs: 20 },

  // Fifth tier - Disaggregated serving (horizontal flow)
  prefillPool: { x: 330, y: 760, w: 280, h: 110, label: 'Prefill Pool', sublabel: '(vLLM - TP=2)', color: '#d2a8ff', fs: 22 },
  nixl: { x: 650, y: 780, w: 280, h: 70, label: 'NIXL Transfer', sublabel: '(GPU-GPU RDMA)', color: '#8b949e', fs: 18 },
  decodePool: { x: 970, y: 760, w: 280, h: 110, label: 'Decode Pool', sublabel: '(vLLM - TP=8)', color: '#d2a8ff', fs: 22 }
};

// Component descriptions with technical details
const tips = {
  gateway: {
    t: 'Gateway API (Istio/Envoy)',
    d: 'Kubernetes Gateway API implementation using Envoy proxy. Entry point for all inference requests with support for ext-proc filters.',
    dt: [
      ['Standard', 'Kubernetes Gateway API (v1+)'],
      ['Implementation', 'Istio, GKE Gateway, or Agentgateway'],
      ['Protocol', 'HTTP/1.1, HTTP/2, gRPC'],
      ['TLS', 'Termination at gateway layer']
    ],
    links: [
      ['Gateway API Docs', 'https://gateway-api.sigs.k8s.io/'],
      ['llm-d Gateway Guide', 'https://deepwiki.com/llm-d/llm-d/2.3-inference-gateway-and-routing']
    ]
  },
  extproc: {
    t: 'Envoy ext-proc (External Processing)',
    d: 'Envoy filter that calls the EPP via gRPC for intelligent routing decisions before forwarding requests to backend vLLM pods.',
    dt: [
      ['Protocol', 'gRPC bidirectional stream'],
      ['Function', 'Pre-request routing hook'],
      ['Called By', 'Envoy when HTTPRoute → InferencePool'],
      ['Enables', 'KV-cache aware routing, predicted latency']
    ],
    links: [
      ['Envoy ext-proc', 'https://www.envoyproxy.io/docs/envoy/latest/configuration/http/http_filters/ext_proc_filter'],
      ['llm-d Integration', 'https://deepwiki.com/llm-d/llm-d-inference-scheduler/11.2-istio-and-kgateway-integration']
    ]
  },
  epp: {
    t: 'EPP (Endpoint Picker)',
    d: 'Core routing engine that evaluates InferencePool pods using configurable scorers (prefix cache, queue depth, predicted latency, KV utilization).',
    dt: [
      ['Scheduling', 'Filter → Score → Select'],
      ['Scorers', 'Prefix cache (3), KV util (2), Queue (2)'],
      ['Response Time', 'Sub-millisecond for cached prompts'],
      ['Saturation', 'Flow control with priority bands']
    ],
    links: [
      ['EPP Architecture', 'https://github.com/llm-d/llm-d-router'],
      ['Scoring Algorithms', 'https://developers.redhat.com/articles/2025/10/07/master-kv-cache-aware-routing-llm-d-efficient-ai-inference']
    ]
  },
  kvindex: {
    t: 'KV Cache Index',
    d: 'Real-time index tracking KV cache block residency across pods. Uses chained FNV-64a hashing over CBOR for deterministic block keys.',
    dt: [
      ['Event Source', 'ZMQ from vLLM pods'],
      ['Block Hash', 'FNV-64a chained over tokens'],
      ['Lookup', 'requestKey → [PodEntry{pod, tier}]'],
      ['Memory', '~339 KB for 365 GB VRAM (1M:1 ratio)']
    ],
    links: [
      ['KV Cache Architecture', 'https://github.com/llm-d/llm-d-kv-cache/blob/main/docs/architecture.md'],
      ['Block Hashing', 'https://llm-d.ai/blog/kvcache-wins-you-can-see']
    ]
  },
  vllmPodA: {
    t: 'vLLM Pod A (High Cache Hit)',
    d: 'vLLM inference server with 85% prefix cache overlap for this request. EPP routes here for fast TTFT.',
    dt: [
      ['Engine', 'vLLM with prefix caching enabled'],
      ['Cache Hit', '85% (85% of prefill skipped)'],
      ['TTFT', '~340ms (88% faster than cold start)'],
      ['GPU Memory', '~90% utilization']
    ],
    links: [
      ['vLLM Docs', 'https://docs.vllm.ai/'],
      ['Prefix Caching', 'https://docs.vllm.ai/en/latest/features/prefix_caching.html']
    ]
  },
  vllmPodB: {
    t: 'vLLM Pod B (Least Loaded)',
    d: 'vLLM pod with lowest queue depth. Selected when cache affinity is low across all pods (fallback routing).',
    dt: [
      ['Selection Reason', 'Lowest queue depth'],
      ['Cache Hit', '3% (minimal overlap)'],
      ['Prefill', 'Full context computation required'],
      ['Queue Depth', '0-2 requests']
    ],
    links: [
      ['vLLM Docs', 'https://docs.vllm.ai/'],
      ['Queue Scorer', 'https://gateway-api-inference-extension.sigs.k8s.io/guides/epp-configuration/config-text/']
    ]
  },
  kvstore: {
    t: 'KV Cache Store',
    d: 'Stores newly computed KV cache blocks for future requests with similar prefixes. Publishes BlockStored events to KV Cache Index via ZMQ.',
    dt: [
      ['Event Type', 'BlockStored (ZMQ)'],
      ['Block Size', '64-128 tokens per block'],
      ['Eviction', 'LRU per pod'],
      ['Tier', 'GPU VRAM (primary), CPU RAM (offload)']
    ],
    links: [
      ['KV Events', 'https://github.com/llm-d/llm-d-kv-cache']
    ]
  },
  prefillPool: {
    t: 'Prefill Pool (vLLM)',
    d: 'Compute-optimized vLLM pods for prefill phase. Smaller tensor parallelism (TP=2) optimized for compute-bound workload.',
    dt: [
      ['Workload', 'Compute-bound (82-95% GPU utilization)'],
      ['Tensor Parallel', 'TP=2 (smaller for compute efficiency)'],
      ['GPU Memory', '0.90 (needs optimizer state space)'],
      ['Output', 'KV cache + KVXfer metadata']
    ],
    links: [
      ['P/D Disaggregation', 'https://llm-d.ai/docs/guide/Installation/pd-disaggregation'],
      ['vLLM Disagg', 'https://docs.vllm.ai/en/latest/features/disagg_prefill/']
    ]
  },
  nixl: {
    t: 'NIXL (NVIDIA Inference Transfer Library)',
    d: 'GPU-to-GPU KV cache transfer via RDMA (InfiniBand/RoCE). Sub-5ms latency for wire-speed disaggregated serving.',
    dt: [
      ['Transport', 'UCX (default) or LIBFABRIC'],
      ['Network', 'InfiniBand HDR, RoCE, TCP fallback'],
      ['Latency', '< 5ms for 47-token prompt'],
      ['Ports', 'UDP 4791 (RoCE), TCP 5557 (metadata)']
    ],
    links: [
      ['NIXL Guide', 'https://docs.vllm.ai/en/stable/features/nixl_connector_usage/'],
      ['NVIDIA NIXL', 'https://developer.nvidia.com/blog/enhancing-distributed-inference-performance-with-the-nvidia-inference-transfer-library/']
    ]
  },
  decodePool: {
    t: 'Decode Pool (vLLM)',
    d: 'Memory-optimized vLLM pods for autoregressive decode. Larger tensor parallelism (TP=8) optimized for memory-bound workload.',
    dt: [
      ['Workload', 'Memory-bound (15-65% compute)'],
      ['Tensor Parallel', 'TP=8 (larger for KV memory distribution)'],
      ['GPU Memory', '0.92 (more space for KV cache)'],
      ['Input', 'KV cache via NIXL pull']
    ],
    links: [
      ['P/D Disaggregation', 'https://llm-d.ai/docs/guide/Installation/pd-disaggregation'],
      ['vLLM Disagg', 'https://docs.vllm.ai/en/latest/features/disagg_prefill/']
    ]
  }
};

// Flow definitions
const flows = {
  'cache-hit': {
    name: 'Cache Hit Flow (Fast Path)',
    steps: [
      { nodes: ['user'], desc: 'User sends POST /v1/completions', req: true, num: 1 },
      { nodes: ['user', 'gateway'], desc: 'Gateway receives request', arrow: true, num: 2 },
      { nodes: ['gateway', 'extproc'], desc: 'Envoy calls ext-proc via gRPC', arrow: true, num: 3 },
      { nodes: ['extproc', 'epp'], desc: 'ext-proc invokes EPP for routing', arrow: true, num: 4 },
      { nodes: ['epp', 'kvindex'], desc: 'EPP queries KV Cache Index', arrow: true, num: 5 },
      { nodes: ['kvindex'], desc: 'Returns cache scores: Pod A (85%), Pod B (12%)', highlight: true, num: 6 },
      { nodes: ['epp'], desc: 'EPP scores: cache=3×85, queue=2×1, util=2×0.6 → Pod A wins', num: 7 },
      { nodes: ['epp', 'vllmPodA'], desc: 'Routes to Pod A (highest score)', arrow: true, num: 8 },
      { nodes: ['vllmPodA'], desc: 'Serves with 85% cached KV (fast TTFT)', highlight: true, num: 9 },
      { nodes: ['vllmPodA', 'gateway'], desc: 'Response flows back to gateway', arrow: true, resp: true, num: 10 },
      { nodes: ['gateway', 'user'], desc: 'Streams tokens to client', arrow: true, resp: true, num: 11 }
    ]
  },
  'cache-miss': {
    name: 'Cache Miss Flow (Cold Start)',
    steps: [
      { nodes: ['user'], desc: 'User sends POST /v1/completions (new prompt)', req: true, num: 1 },
      { nodes: ['user', 'gateway'], desc: 'Gateway receives request', arrow: true, num: 2 },
      { nodes: ['gateway', 'extproc'], desc: 'Envoy calls ext-proc via gRPC', arrow: true, num: 3 },
      { nodes: ['extproc', 'epp'], desc: 'ext-proc invokes EPP for routing', arrow: true, num: 4 },
      { nodes: ['epp', 'kvindex'], desc: 'EPP queries KV Cache Index', arrow: true, num: 5 },
      { nodes: ['kvindex'], desc: 'Returns low cache scores: all pods < 5%', highlight: true, num: 6 },
      { nodes: ['epp'], desc: 'EPP fallback: routes to least-loaded pod (Pod B)', num: 7 },
      { nodes: ['epp', 'vllmPodB'], desc: 'Routes to Pod B (queue depth = 0)', arrow: true, num: 8 },
      { nodes: ['vllmPodB'], desc: 'Full prefill required (computes entire context)', highlight: true, num: 9 },
      { nodes: ['vllmPodB', 'kvstore'], desc: 'Publishes BlockStored events to KV index', arrow: true, num: 10 },
      { nodes: ['vllmPodB', 'gateway'], desc: 'Response flows back to gateway', arrow: true, resp: true, num: 11 },
      { nodes: ['gateway', 'user'], desc: 'Streams tokens (higher TTFT)', arrow: true, resp: true, num: 12 }
    ]
  },
  'disaggregated': {
    name: 'Disaggregated Serving (P/D Split)',
    steps: [
      { nodes: ['user'], desc: 'User sends POST /v1/completions (long prompt)', req: true, num: 1 },
      { nodes: ['user', 'gateway'], desc: 'Gateway receives request', arrow: true, num: 2 },
      { nodes: ['gateway', 'extproc'], desc: 'Envoy calls ext-proc via gRPC', arrow: true, num: 3 },
      { nodes: ['extproc', 'epp'], desc: 'EPP determines prefill pool routing', arrow: true, num: 4 },
      { nodes: ['epp', 'prefillPool'], desc: 'Routes to prefill pool (TP=2, compute-optimized)', arrow: true, num: 5 },
      { nodes: ['prefillPool'], desc: 'Computes KV cache (prefill phase)', highlight: true, num: 6 },
      { nodes: ['prefillPool', 'nixl'], desc: 'Returns KVXfer metadata to sidecar', arrow: true, num: 7 },
      { nodes: ['nixl'], desc: 'GPU-to-GPU RDMA transfer via UCX/InfiniBand', highlight: true, num: 8 },
      { nodes: ['nixl', 'decodePool'], desc: 'KV cache pulled by decode pool', arrow: true, num: 9 },
      { nodes: ['decodePool'], desc: 'Autoregressive decode (TP=8, memory-optimized)', highlight: true, num: 10 },
      { nodes: ['decodePool', 'gateway'], desc: 'Response flows back to gateway', arrow: true, resp: true, num: 11 },
      { nodes: ['gateway', 'user'], desc: 'Streams tokens (optimized throughput)', arrow: true, resp: true, num: 12 }
    ]
  }
};

function resize() {
  const panelW = 380;
  W = canvas.width = window.innerWidth - panelW;
  H = canvas.height = window.innerHeight;
  sc = Math.min(W / LW, H / LH) * 0.95;
  ox = (W - LW * sc) / 2;
  draw();
}

function C() {
  return isDark
    ? { bg:'#0d1117', box:'#161b22', bdr:'#30363d', txt:'#c9d1d9', dim:'#8b949e' }
    : { bg:'#fff', box:'#f6f8fa', bdr:'#d0d7de', txt:'#24292f', dim:'#656d76' };
}

function drawNode(key, active, highlight) {
  const n = N[key];
  const c = C();

  if (n.type === 'boundary') {
    ctx.strokeStyle = c.bdr;
    ctx.setLineDash([8, 4]);
    ctx.lineWidth = 2;
    ctx.strokeRect(tx(n.x), ty(n.y), ts(n.w), ts(n.h));
    ctx.setLineDash([]);
    if (n.label) {
      ctx.fillStyle = c.dim;
      ctx.font = `${ts(14)}px sans-serif`;
      ctx.textAlign = 'left';
      ctx.fillText(n.label, tx(n.x + 10), ty(n.y - 8));
    }
    return;
  }

  ctx.save();
  ctx.globalAlpha = active ? 1 : 0.4;

  const x = tx(n.x), y = ty(n.y), w = ts(n.w), h = ts(n.h), r = ts(8);

  // Fill
  ctx.fillStyle = n.color || '#a78bfa';
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.fill();

  // Border
  if (highlight || key === highlightKey) {
    ctx.strokeStyle = n.color || '#a78bfa';
    ctx.lineWidth = ts(3);
    ctx.shadowBlur = ts(20);
    ctx.shadowColor = n.color || '#a78bfa';
  } else if (active) {
    ctx.strokeStyle = n.color || '#a78bfa';
    ctx.lineWidth = ts(2);
  } else {
    ctx.strokeStyle = c.bdr;
    ctx.lineWidth = ts(1);
  }
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Text
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const fontSize = n.fs || 16;
  ctx.font = `bold ${ts(fontSize)}px sans-serif`;
  const cy = n.sublabel ? y + h/2 - ts(10) : y + h/2;
  ctx.fillText(n.label, x + w/2, cy);

  if (n.sublabel) {
    ctx.font = `${ts(fontSize * 0.75)}px sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText(n.sublabel, x + w/2, cy + ts(18));
  }

  ctx.restore();
}

function drawArrow(fromKey, toKey, stepNum, isResponse) {
  const from = N[fromKey], to = N[toKey];

  let x1, y1, x2, y2;

  const fc = { x: from.x + from.w/2, y: from.y + from.h/2 };
  const tc = { x: to.x + to.w/2, y: to.y + to.h/2 };
  const dx = tc.x - fc.x, dy = tc.y - fc.y;

  if (Math.abs(dx) > Math.abs(dy)) {
    // Horizontal
    if (dx > 0) {
      x1 = from.x + from.w; y1 = fc.y;
      x2 = to.x; y2 = tc.y;
    } else {
      x1 = from.x; y1 = fc.y;
      x2 = to.x + to.w; y2 = tc.y;
    }
  } else {
    // Vertical
    if (dy > 0) {
      x1 = fc.x; y1 = from.y + from.h;
      x2 = tc.x; y2 = to.y;
    } else {
      x1 = fc.x; y1 = from.y;
      x2 = tc.x; y2 = to.y + to.h;
    }
  }

  ctx.save();
  ctx.globalAlpha = 0.8;

  // Arrow color - blue for request, green for response
  const arrowColor = isResponse ? '#3fb950' : '#58a6ff';

  // Draw line
  ctx.beginPath();
  ctx.moveTo(tx(x1), ty(y1));
  ctx.lineTo(tx(x2), ty(y2));
  ctx.strokeStyle = arrowColor;
  ctx.lineWidth = ts(2.5);
  ctx.stroke();

  // Arrowhead
  const angle = Math.atan2(y2 - y1, x2 - x1);
  const size = ts(10);
  ctx.beginPath();
  ctx.moveTo(tx(x2), ty(y2));
  ctx.lineTo(tx(x2) - size * Math.cos(angle - 0.4), ty(y2) - size * Math.sin(angle - 0.4));
  ctx.lineTo(tx(x2) - size * Math.cos(angle + 0.4), ty(y2) - size * Math.sin(angle + 0.4));
  ctx.closePath();
  ctx.fillStyle = arrowColor;
  ctx.fill();

  // Numbered dot at midpoint (matching AI Gateway style)
  if (stepNum != null) {
    const mx = (x1 + x2) / 2;
    const my = (y1 + y2) / 2;
    const r = ts(12);

    ctx.globalAlpha = 1;
    ctx.beginPath();
    ctx.arc(tx(mx), ty(my), r, 0, Math.PI * 2);
    ctx.fillStyle = arrowColor;
    ctx.fill();

    ctx.font = `bold ${ts(10)}px system-ui`;
    ctx.fillStyle = isDark ? '#0d1117' : '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(stepNum), tx(mx), ty(my));
  }

  ctx.restore();
}

function draw() {
  const c = C();
  ctx.fillStyle = c.bg;
  ctx.fillRect(0, 0, W, H);

  const flow = flows[currentFlow];
  const activeNodes = new Set();
  const arrows = [];
  let highlightNodes = new Set();

  for (let i = 0; i <= stepIdx; i++) {
    const step = flow.steps[i];
    step.nodes.forEach(n => activeNodes.add(n));
    if (step.arrow && step.nodes.length === 2) {
      arrows.push({ from: step.nodes[0], to: step.nodes[1], num: step.num, resp: step.resp });
    }
    if (i === stepIdx && step.highlight) {
      step.nodes.forEach(n => highlightNodes.add(n));
    }
  }

  // Draw boundaries first
  ['cluster', 'poolBoundary'].forEach(key => {
    if (N[key]) drawNode(key, true, false);
  });

  // Draw nodes
  Object.keys(N).forEach(key => {
    if (N[key].type !== 'boundary') {
      drawNode(key, activeNodes.has(key), highlightNodes.has(key));
    }
  });

  // Draw arrows
  arrows.forEach(({ from, to, num, resp }) => drawArrow(from, to, num, resp));
}

function updateUI() {
  const flow = flows[currentFlow];

  // Update steps list
  const stepsList = document.getElementById('stepsList');
  stepsList.innerHTML = '';
  flow.steps.forEach((step, i) => {
    const div = document.createElement('div');
    div.className = 'step ' + (i < stepIdx ? 'done' : i === stepIdx ? 'active' : 'pending');
    div.innerHTML = `<span class="step-mk"></span><span>${step.desc}</span>`;
    div.onclick = () => { stepIdx = i; updateUI(); draw(); };
    stepsList.appendChild(div);
  });

  // Update inspector
  const inspector = document.getElementById('inspector');
  const step = flow.steps[stepIdx];
  let html = '';

  if (step.req) {
    html += '<div class="insp-sec">Request Headers:</div>';
    html += '<div class="insp-line">POST /v1/completions HTTP/2</div>';
    html += '<div class="insp-line">Host: llm-d-gateway.cluster.local</div>';
    html += '<div class="insp-line">Content-Type: application/json</div>';
    html += '<div class="insp-sec">Body:</div>';
    html += '<div class="insp-line">{"model": "llama-3.1-70b",</div>';
    html += '<div class="insp-line"> "messages": [{"role": "user", "content": "..."}],</div>';
    html += '<div class="insp-line"> "max_tokens": 100}</div>';
  } else if (step.resp) {
    html += '<div class="insp-sec">Response:</div>';
    html += '<div class="insp-line">HTTP/2 200 OK</div>';
    html += '<div class="insp-line">Content-Type: text/event-stream</div>';
    html += '<div class="insp-sec">Body (streaming):</div>';
    html += '<div class="insp-line">data: {"choices": [{"delta": {"content": "..."}}]}</div>';
  } else {
    html += `<div class="insp-sec">Step ${stepIdx + 1}:</div>`;
    html += `<div class="insp-line">${step.desc}</div>`;
    if (step.nodes.length === 1 && tips[step.nodes[0]]) {
      html += `<div style="margin-top:8px;font-size:11px;color:#8b949e">Click "${N[step.nodes[0]].label}" for details</div>`;
    }
  }

  inspector.innerHTML = html;
  draw();
}

function changeFlow() {
  currentFlow = document.getElementById('flowSel').value;
  stepIdx = 0;
  updateUI();
}

function togglePlay() {
  running = !running;
  document.getElementById('playBtn').textContent = running ? '❚❚ Pause' : '▶ Play';
  if (running) animate();
}

function reset() {
  running = false;
  stepIdx = 0;
  document.getElementById('playBtn').textContent = '▶ Play';
  updateUI();
}

function changeSpeed() {
  playbackSpeed = parseFloat(document.getElementById('speedSel').value);
}

function animate() {
  if (!running) return;
  const flow = flows[currentFlow];
  if (stepIdx < flow.steps.length - 1) {
    stepTimer = setTimeout(() => {
      stepIdx++;
      updateUI();
      animate();
    }, 1000 / playbackSpeed);
  } else {
    running = false;
    document.getElementById('playBtn').textContent = '▶ Play';
  }
}

function toggleTheme() {
  isDark = !isDark;
  document.body.classList.toggle('light');
  document.getElementById('thm').textContent = isDark ? '☾' : '☀';
  draw();
}

let overlayWasRunning = false;
function showOverlay(key) {
  const tip = tips[key], n = N[key];
  if (!tip) return;

  overlayWasRunning = running;
  highlightKey = key;
  if (running) {
    running = false;
    clearTimeout(stepTimer);
    document.getElementById('playBtn').textContent = '▶ Play';
  }

  const ov = document.getElementById('overlay');
  const card = document.getElementById('overlay-card');
  document.getElementById('overlay-accent').style.background = n.color || '#a78bfa';
  document.getElementById('overlay-title').textContent = tip.t;
  document.getElementById('overlay-title').style.color = n.color || '#c9d1d9';
  document.getElementById('overlay-desc').textContent = tip.d;

  let dh = '';
  if (tip.dt) {
    tip.dt.forEach(([l,v]) => {
      dh += `<div style="display:flex;gap:12px;padding:5px 0;border-bottom:1px solid #21262d"><span style="color:#8b949e;min-width:110px;flex-shrink:0">${l}</span><span style="color:#c9d1d9">${v}</span></div>`;
    });
  }
  if (tip.links) {
    dh += '<div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">';
    tip.links.forEach(([l,u]) => {
      dh += `<a href="${u}" target="_blank" style="color:#a78bfa;font-size:12px;text-decoration:none;padding:4px 10px;border:1px solid #30363d;border-radius:6px;transition:all .15s" onmouseover="this.style.borderColor='#a78bfa'" onmouseout="this.style.borderColor='#30363d'">${l} ↗</a>`;
    });
    dh += '</div>';
  }
  document.getElementById('overlay-details').innerHTML = dh;
  document.getElementById('overlay-resume').style.display = overlayWasRunning ? 'block' : 'none';

  const nx = tx(n.x), ny = ty(n.y), nw = ts(n.w), nh = ts(n.h);
  let cx = nx + nw + 20;
  if (cx + 440 > W) cx = Math.max(10, nx - 440);
  const cy = Math.max(10, Math.min(ny, H - 500));
  card.style.left = cx + 'px';
  card.style.top = cy + 'px';
  ov.style.display = 'block';

  const hb = document.getElementById('highlight-box');
  hb.style.left = nx + 'px';
  hb.style.top = ny + 'px';
  hb.style.width = nw + 'px';
  hb.style.height = nh + 'px';
  hb.style.border = `3px solid ${n.color || '#a78bfa'}`;
  hb.style.boxShadow = `0 0 30px ${n.color || '#a78bfa'}88`;
  hb.style.background = isDark ? '#161b22' : '#f6f8fa';
  hb.style.display = 'block';

  draw();
}

function closeOverlay() {
  document.getElementById('overlay').style.display = 'none';
  document.getElementById('highlight-box').style.display = 'none';
  highlightKey = null;
  draw();
  if (overlayWasRunning) {
    running = true;
    document.getElementById('playBtn').textContent = '❚❚ Pause';
    animate();
  }
}

// Click handler
canvas.addEventListener('click', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  for (const [key, n] of Object.entries(N)) {
    if (n.type === 'boundary') continue;
    const nx = tx(n.x), ny = ty(n.y), nw = ts(n.w), nh = ts(n.h);
    if (mx >= nx && mx <= nx + nw && my >= ny && my <= ny + nh) {
      if (tips[key]) {
        showOverlay(key);
        break;
      }
    }
  }
});

// Hover cursor
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  let found = false;

  for (const [key, n] of Object.entries(N)) {
    if (n.type === 'boundary') continue;
    const nx = tx(n.x), ny = ty(n.y), nw = ts(n.w), nh = ts(n.h);
    if (mx >= nx && mx <= nx + nw && my >= ny && my <= ny + nh && tips[key]) {
      found = true;
      break;
    }
  }
  canvas.style.cursor = found ? 'pointer' : 'default';
});

window.addEventListener('resize', resize);
resize();
updateUI();
</script>
</body>
