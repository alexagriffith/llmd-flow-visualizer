<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>llm-d Request Flow Visualizer</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#c9d1d9;overflow:hidden;transition:background .3s,color .3s}
body.light{background:#fff;color:#24292f}

.right-panel{position:fixed;top:0;right:0;width:380px;height:100vh;z-index:100;display:flex;flex-direction:column;background:#161b22;border-left:1px solid #30363d;overflow:hidden;transition:background .3s,border-color .3s}
body.light .right-panel{background:#f6f8fa;border-color:#d0d7de}

.flow-bar{padding:12px 16px;border-bottom:1px solid #30363d;flex-shrink:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
body.light .flow-bar{border-color:#d0d7de}
.flow-bar select{flex:1;padding:7px 10px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;font-size:13px;font-family:inherit;cursor:pointer}
body.light .flow-bar select{background:#fff;color:#24292f;border-color:#d0d7de}
.flow-bar button{padding:7px 14px;border:1px solid #30363d;border-radius:6px;background:#161b22;color:#c9d1d9;cursor:pointer;font-size:13px;font-family:inherit;transition:all .15s}
body.light .flow-bar button{background:#f6f8fa;color:#24292f;border-color:#d0d7de}
.flow-bar button:hover{border-color:#a78bfa}
.flow-bar .start{border-color:#a78bfa;color:#a78bfa;min-width:90px}
.flow-bar .rst{border-color:#f0883e;color:#f0883e}

.steps-section{padding:10px 16px;border-bottom:1px solid #30363d;flex:2;overflow-y:auto}
body.light .steps-section{border-color:#d0d7de}
.steps-title{font-weight:700;margin-bottom:6px;font-size:14px}
.step{margin:2px 0;color:#484f58;display:flex;align-items:flex-start;gap:6px;font-size:12px;line-height:1.4;cursor:pointer;padding:3px 4px;border-radius:4px;transition:all .2s}
body.light .step{color:#b0b8c1}
.step:hover{background:#a78bfa22;cursor:pointer;color:#a78bfa;transform:translateX(4px);border-left:2px solid #a78bfa;padding-left:6px}
body.light .step:hover{background:#e5dbff88;cursor:pointer;color:#8250df;transform:translateX(4px);border-left:2px solid #8250df;padding-left:6px}
.step-mk{flex-shrink:0;width:16px;text-align:center;font-size:13px}
.step.pending{color:#484f58}
body.light .step.pending{color:#b0b8c1}
.step.pending .step-mk::before{content:'\25CB'}
.step.active{color:#a78bfa}
.step.active .step-mk::before{content:'\25CF'}
.step.done{color:#3fb950}
.step.done .step-mk::before{content:'\2713'}

.insp-section{flex:3;overflow-y:auto;padding:10px 16px;font-family:'SF Mono',Menlo,Consolas,monospace;font-size:11px}
.insp-title{font-weight:700;font-size:14px;margin-bottom:6px;font-family:-apple-system,sans-serif}
.insp-sec{margin:6px 0 2px;font-weight:600;color:#a78bfa;font-size:12px;font-family:-apple-system,sans-serif}
.insp-line{margin:1px 0;padding:2px 6px;border-radius:3px;white-space:pre-wrap;line-height:1.6}

.theme-toggle{position:fixed;top:16px;right:396px;z-index:200;width:36px;height:36px;border-radius:8px;border:1px solid #30363d;background:#161b22;color:#c9d1d9;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s}
body.light .theme-toggle{background:#f6f8fa;color:#24292f;border-color:#d0d7de}

.viz-title{position:fixed;top:14px;left:0;right:380px;z-index:200;text-align:center;font-size:22px;font-weight:700;background:linear-gradient(135deg,#a78bfa,#06b6d4,#f0883e);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.5px;pointer-events:none}

.legend{position:fixed;bottom:16px;left:16px;z-index:100;padding:10px 14px;background:#161b22;border:1px solid #30363d;border-radius:10px;font-size:13px;transition:all .3s}
body.light .legend{background:#f6f8fa;border-color:#d0d7de}
.legend-title{font-weight:600;margin-bottom:5px;font-size:14px}
.legend-item{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:13px}
.legend-dot{width:11px;height:11px;border-radius:50%}

#overlay{display:none;position:fixed;top:0;left:0;right:380px;bottom:0;z-index:300;background:rgba(0,0,0,0.7)}
#overlay-card{position:absolute;width:420px;background:#161b22;border:2px solid #30363d;border-radius:12px;padding:20px;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
body.light #overlay-card{background:#f6f8fa;border-color:#d0d7de}
#overlay-accent{height:4px;margin:-20px -20px 12px;border-radius:10px 10px 0 0}
#overlay-title{font-size:18px;font-weight:700;margin-bottom:8px}
#overlay-desc{font-size:14px;color:#8b949e;margin-bottom:16px;line-height:1.5}
#overlay-details{font-size:13px}
#overlay-close{position:absolute;top:16px;right:16px;width:24px;height:24px;border:none;background:transparent;color:#8b949e;font-size:20px;cursor:pointer;line-height:1}
#overlay-resume{margin-top:16px;padding:8px 16px;background:#3fb950;color:#fff;border:none;border-radius:6px;cursor:pointer;font-family:inherit;font-size:13px}
#overlay-resume:hover{background:#2da44e}
#highlight-box{display:none;position:absolute;pointer-events:none;z-index:250;border-radius:8px}

.steps-section::-webkit-scrollbar,.insp-section::-webkit-scrollbar{width:6px}
.steps-section::-webkit-scrollbar-track,.insp-section::-webkit-scrollbar-track{background:transparent}
.steps-section::-webkit-scrollbar-thumb,.insp-section::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
body.light .steps-section::-webkit-scrollbar-thumb,body.light .insp-section::-webkit-scrollbar-thumb{background:#d0d7de}
</style>
</head>
<body>
<div class="theme-toggle" id="thm" onclick="toggleTheme()">☾</div>
<div class="viz-title">llm-d Request Flow Visualizer</div>

<canvas id="canvas"></canvas>

<div class="right-panel">
  <div class="flow-bar">
    <select id="flowSel" onchange="changeFlow()">
      <option value="cache-hit">Cache Hit Flow (Fast Path)</option>
      <option value="cache-miss">Cache Miss Flow (Cold Start)</option>
      <option value="disaggregated">Disaggregated Serving (P/D Split)</option>
    </select>
    <button class="start" id="playBtn" onclick="togglePlay()">▶ Play</button>
    <button class="rst" onclick="reset()">Reset</button>
    <select id="speedSel" style="width:70px" onchange="changeSpeed()">
      <option value="2">0.5x</option>
      <option value="1" selected>1x</option>
      <option value="0.5">2x</option>
    </select>
  </div>

  <div class="steps-section">
    <div class="steps-title">Flow Steps <span style="color:#8b949e;font-weight:400;font-size:12px">· click to jump</span></div>
    <div id="stepsList"></div>
  </div>

  <div class="insp-section">
    <div class="insp-title">Request / Response</div>
    <div id="inspector"></div>
  </div>
</div>

<div class="legend">
  <div class="legend-title">Legend</div>
  <div class="legend-item"><div class="legend-dot" style="background:#58a6ff"></div>Request</div>
  <div class="legend-item"><div class="legend-dot" style="background:#3fb950"></div>Response</div>
  <div class="legend-item"><div class="legend-dot" style="background:#f0883e"></div>Auth / Rate Limit</div>
  <div class="legend-item"><div class="legend-dot" style="background:#d2a8ff"></div>IPP Container</div>
  <div class="legend-item"><div class="legend-dot" style="background:#79c0ff"></div>Req / Resp Plugins</div>
</div>

<div id="overlay" onclick="if(event.target===this)closeOverlay()">
  <div id="overlay-card">
    <div id="overlay-accent"></div>
    <button id="overlay-close" onclick="closeOverlay()">×</button>
    <div id="overlay-title"></div>
    <div id="overlay-desc"></div>
    <div id="overlay-details"></div>
    <button id="overlay-resume" onclick="closeOverlay()" style="display:none">▶ Resume Flow</button>
  </div>
</div>
<div id="highlight-box"></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let W, H, sc = 1, ox = 0, oy = 30;
const LW = 1400, LH = 1050;

let isDark = true;
let currentFlow = 'cache-hit';
let stepIdx = 0;
let running = false, paused = false;
let playbackSpeed = 1;
let stepTimer = null;
let highlightKey = null;

const tx = x => x * sc + ox;
const ty = y => y * sc + oy;
const ts = s => s * sc;

// Nodes - matching AI Gateway structure
const N = {
  user: { x: 80, y: 160, w: 140, h: 60, label: 'Client / Agent', type: 'icon' },

  cluster: { x: 260, y: 80, w: 1070, h: 880, type: 'boundary' },
  llmdGateway: { x: 295, y: 115, w: 1000, h: 500, type: 'container', label: 'llm-d Gateway', color: '#58a6ff' },

  gateway: { x: 360, y: 145, w: 700, h: 90, label: 'Gateway API', sublabel: '(Istio/Envoy)', color: '#58a6ff', fs: 24 },

  eppContainer: { x: 800, y: 290, w: 240, h: 280, type: 'container', label: 'Scheduler / EPP (ext_proc)', color: '#d2a8ff' },
  epp: { x: 825, y: 330, w: 190, h: 70, label: 'Endpoint Picker', sublabel: 'Pod Selection', color: '#79c0ff', fs: 18, inner: true },
  kvindex: { x: 825, y: 430, w: 190, h: 100, label: 'KV Cache Index', sublabel: 'Block tracker', color: '#f0883e', fs: 16, inner: true },

  pool: { x: 310, y: 640, w: 780, h: 165, type: 'boundary', label: 'InferencePool' },
  vllmPodA: { x: 350, y: 680, w: 220, h: 90, label: 'vLLM', sublabel: 'Decode Pod A', color: '#d2a8ff', fs: 18 },
  nixl: { x: 620, y: 695, w: 200, h: 60, label: 'NIXL', sublabel: 'KV Transfer (KVXfer)', color: '#8b949e', fs: 14 },
  vllmPodB: { x: 860, y: 680, w: 200, h: 90, label: 'vLLM', sublabel: 'Prefill Pod B', color: '#d2a8ff', fs: 18 },
};

const tips = {};

const flows = {
  'cache-hit': {
    name: 'Cache Hit Flow',
    steps: [
      { nodes: ['user'], num: 1, desc: 'Client sends POST /v1/chat/completions' },
      { nodes: ['user', 'gateway'], num: 2, desc: 'Gateway → Kuadrant Wasm Shim', arrow: true },
      { nodes: ['gateway', 'epp'], num: 3, desc: 'Gateway → ext_proc (IPP)', arrow: true },
      { nodes: ['epp', 'kvindex'], num: 4, desc: 'Kuadrant → MaaS API (key validation)', arrow: true },
      { nodes: ['kvindex'], num: 5, desc: 'MaaS API responds: key valid' },
      { nodes: ['epp', 'vllmPodA'], num: 6, desc: 'EPP routes to Pod A (highest cache)', arrow: true },
      { nodes: ['vllmPodA'], num: 7, desc: 'vLLM serves with cached KV' },
      { nodes: ['vllmPodA', 'gateway'], num: 8, desc: 'Response → Gateway', arrow: true, resp: true },
      { nodes: ['gateway', 'user'], num: 9, desc: 'Gateway → Client (streaming)', arrow: true, resp: true }
    ]
  },
  'cache-miss': {
    name: 'Cache Miss Flow',
    steps: [
      { nodes: ['user'], num: 1, desc: 'Client sends request (new prompt)' },
      { nodes: ['user', 'gateway'], num: 2, desc: 'Gateway receives request', arrow: true },
      { nodes: ['gateway', 'epp'], num: 3, desc: 'Gateway → ext_proc', arrow: true },
      { nodes: ['epp', 'kvindex'], num: 4, desc: 'EPP queries KV index', arrow: true },
      { nodes: ['kvindex'], num: 5, desc: 'Returns low cache scores' },
      { nodes: ['epp', 'vllmPodA'], num: 6, desc: 'Routes to least-loaded pod', arrow: true },
      { nodes: ['vllmPodA'], num: 7, desc: 'Full prefill required' },
      { nodes: ['vllmPodA', 'gateway'], num: 8, desc: 'Response → Gateway', arrow: true, resp: true },
      { nodes: ['gateway', 'user'], num: 9, desc: 'Gateway → Client', arrow: true, resp: true }
    ]
  },
  'disaggregated': {
    name: 'Disaggregated Serving',
    steps: [
      { nodes: ['user'], num: 1, desc: 'Client sends request' },
      { nodes: ['user', 'gateway'], num: 2, desc: 'Gateway receives', arrow: true },
      { nodes: ['gateway', 'epp'], num: 3, desc: 'Gateway → EPP', arrow: true },
      { nodes: ['epp', 'vllmPodB'], num: 4, desc: 'EPP → Prefill Pod', arrow: true },
      { nodes: ['vllmPodB'], num: 5, desc: 'Computes KV cache' },
      { nodes: ['vllmPodB', 'nixl'], num: 6, desc: 'KVXfer metadata', arrow: true },
      { nodes: ['nixl', 'vllmPodA'], num: 7, desc: 'KV transferred to decode', arrow: true },
      { nodes: ['vllmPodA'], num: 8, desc: 'Decode generates tokens' },
      { nodes: ['vllmPodA', 'gateway'], num: 9, desc: 'Response → Gateway', arrow: true, resp: true },
      { nodes: ['gateway', 'user'], num: 10, desc: 'Gateway → Client', arrow: true, resp: true }
    ]
  }
};

function resize() {
  const panelW = 380;
  W = canvas.width = window.innerWidth - panelW;
  H = canvas.height = window.innerHeight;
  sc = Math.min(W / LW, H / LH) * 0.92;
  ox = (W - LW * sc) / 2;
  draw();
}

function C() {
  return isDark
    ? { bg:'#0d1117', box:'#161b22', bdr:'#30363d', txt:'#c9d1d9', dim:'#8b949e' }
    : { bg:'#fff', box:'#f6f8fa', bdr:'#d0d7de', txt:'#24292f', dim:'#656d76' };
}

function drawNode(key, active) {
  const n = N[key];
  const c = C();

  if (n.type === 'boundary') {
    ctx.strokeStyle = c.bdr;
    ctx.setLineDash([8, 4]);
    ctx.lineWidth = 2;
    ctx.strokeRect(tx(n.x), ty(n.y), ts(n.w), ts(n.h));
    ctx.setLineDash([]);
    if (n.label) {
      ctx.fillStyle = c.dim;
      ctx.font = `${ts(13)}px sans-serif`;
      ctx.textAlign = 'left';
      ctx.fillText(n.label, tx(n.x + 10), ty(n.y - 8));
    }
    return;
  }

  if (n.type === 'container') {
    ctx.strokeStyle = n.color || c.bdr;
    ctx.setLineDash([6, 4]);
    ctx.lineWidth = 2;
    ctx.strokeRect(tx(n.x), ty(n.y), ts(n.w), ts(n.h));
    ctx.setLineDash([]);
    if (n.label) {
      ctx.fillStyle = n.color || c.dim;
      ctx.font = `${ts(14)}px sans-serif`;
      ctx.textAlign = 'left';
      ctx.fillText(n.label, tx(n.x + 12), ty(n.y - 8));
    }
    return;
  }

  ctx.save();
  ctx.globalAlpha = active ? 1 : 0.35;

  const x = tx(n.x), y = ty(n.y), w = ts(n.w), h = ts(n.h), r = ts(8);

  ctx.fillStyle = n.color || '#d2a8ff';
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, r);
  ctx.fill();

  if (active) {
    ctx.strokeStyle = n.color || '#d2a8ff';
    ctx.lineWidth = ts(2);
    ctx.stroke();
  }

  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const fontSize = n.fs || 18;
  ctx.font = `bold ${ts(fontSize)}px sans-serif`;
  const cy = n.sublabel ? y + h/2 - ts(9) : y + h/2;
  ctx.fillText(n.label, x + w/2, cy);

  if (n.sublabel) {
    ctx.font = `${ts(fontSize * 0.7)}px sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText(n.sublabel, x + w/2, cy + ts(16));
  }

  ctx.restore();
}

function drawArrow(fromKey, toKey, stepNum, isResponse = false) {
  const from = N[fromKey], to = N[toKey];

  ctx.save();
  const x1 = from.x + from.w/2;
  const y1 = isResponse ? from.y : from.y + from.h;
  const x2 = to.x + to.w/2;
  const y2 = isResponse ? to.y + to.h : to.y;

  // Connection dot
  ctx.fillStyle = isResponse ? '#3fb950' : '#58a6ff';
  ctx.beginPath();
  ctx.arc(tx(x1), ty(y1), ts(7), 0, Math.PI * 2);
  ctx.fill();

  // Step number
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${ts(11)}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(stepNum, tx(x1), ty(y1));

  // Arrow line
  ctx.strokeStyle = isResponse ? '#3fb950' : '#a78bfa';
  ctx.lineWidth = ts(3);
  ctx.beginPath();
  ctx.moveTo(tx(x1), ty(y1));

  const dx = Math.abs(x2 - x1);
  if (dx > 80) {
    const mid = (y1 + y2) / 2;
    ctx.lineTo(tx(x1), ty(mid));
    ctx.lineTo(tx(x2), ty(mid));
    ctx.lineTo(tx(x2), ty(y2));
  } else {
    ctx.lineTo(tx(x2), ty(y2));
  }
  ctx.stroke();

  // Arrowhead
  ctx.fillStyle = isResponse ? '#3fb950' : '#a78bfa';
  const dir = isResponse ? 1 : -1;
  ctx.beginPath();
  ctx.moveTo(tx(x2), ty(y2));
  ctx.lineTo(tx(x2 - 8), ty(y2 + dir * 12));
  ctx.lineTo(tx(x2 + 8), ty(y2 + dir * 12));
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function draw() {
  const c = C();
  ctx.fillStyle = c.bg;
  ctx.fillRect(0, 0, W, H);

  const flow = flows[currentFlow];
  const activeNodes = new Set();
  const arrows = [];

  for (let i = 0; i <= stepIdx; i++) {
    const step = flow.steps[i];
    step.nodes.forEach(n => activeNodes.add(n));
    if (step.arrow && step.nodes.length === 2) {
      arrows.push({ from: step.nodes[0], to: step.nodes[1], num: step.num, resp: step.resp });
    }
  }

  ['cluster', 'llmdGateway', 'eppContainer', 'pool'].forEach(key => {
    if (N[key]) drawNode(key, true);
  });

  Object.keys(N).forEach(key => {
    if (!N[key].type || N[key].type === 'icon') {
      drawNode(key, activeNodes.has(key));
    }
  });

  arrows.forEach(({ from, to, num, resp }) => drawArrow(from, to, num, resp));
}

function updateUI() {
  const flow = flows[currentFlow];
  const stepsList = document.getElementById('stepsList');
  stepsList.innerHTML = '';
  flow.steps.forEach((step, i) => {
    const div = document.createElement('div');
    div.className = 'step ' + (i < stepIdx ? 'done' : i === stepIdx ? 'active' : 'pending');
    div.innerHTML = `<span class="step-mk"></span><span>${step.desc}</span>`;
    div.onclick = () => { stepIdx = i; updateUI(); draw(); };
    stepsList.appendChild(div);
  });

  const inspector = document.getElementById('inspector');
  inspector.innerHTML = '<div class="insp-sec">Step ' + (stepIdx + 1) + ':</div><div class="insp-line">' + flow.steps[stepIdx].desc + '</div>';
  draw();
}

function changeFlow() {
  currentFlow = document.getElementById('flowSel').value;
  stepIdx = 0;
  updateUI();
}

function togglePlay() {
  running = !running;
  document.getElementById('playBtn').textContent = running ? '❚❚ Pause' : '▶ Play';
  if (running) animate();
}

function reset() {
  running = false;
  stepIdx = 0;
  document.getElementById('playBtn').textContent = '▶ Play';
  updateUI();
}

function changeSpeed() {
  playbackSpeed = parseFloat(document.getElementById('speedSel').value);
}

function animate() {
  if (!running) return;
  const flow = flows[currentFlow];
  if (stepIdx < flow.steps.length - 1) {
    stepTimer = setTimeout(() => {
      stepIdx++;
      updateUI();
      animate();
    }, 1000 / playbackSpeed);
  } else {
    running = false;
    document.getElementById('playBtn').textContent = '▶ Play';
  }
}

function toggleTheme() {
  isDark = !isDark;
  document.body.classList.toggle('light');
  document.getElementById('thm').textContent = isDark ? '☾' : '☀';
  draw();
}

function closeOverlay() {}

canvas.addEventListener('click', e => {});
canvas.addEventListener('mousemove', e => {});

window.addEventListener('resize', resize);
resize();
updateUI();
</script>
</body>
</html>
